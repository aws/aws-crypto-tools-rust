[package]
name = "aws-esdk"
version = "2.0.0"
edition = "2024"
keywords = ["cryptography", "security", "encryption"]
categories = ["cryptography"]
license = "ISC AND (Apache-2.0 OR ISC)"
description = "AWS Encryption SDK for Rust — client-side envelope encryption using the AWS Encryption SDK message format."
repository = "https://github.com/aws/aws-client-encryption-rust/aws-esdk/"
authors = ["AWS-CryptoTools"]
documentation = "https://docs.rs/crate/aws-esdk"
readme = "README.md"

[dependencies]
tokio = { version = "1.49", default-features = false, features = ["io-util", "rt"] }

aws-smithy-types = "1.8.1"
aws-sdk-kms = "1.123.0"
aws-sdk-dynamodb = "1.130.0"
aws-crypto-mpl = { path = "../mpl" }
aws-mpl-primitives = { path = "../prim" }
aws-lc-rs = { version = "1.18.1", default-features = false }
zeroize = "1.9.0"

# Necessary for examples
[dev-dependencies]
aws-crypto-mpl = { path = "../mpl", features = ["test-utils"] }
aws-smithy-runtime-api = { version = "1.19.0", features = ["http-1x"] }
tokio = { version = "1.49", features = ["rt", "macros", "rt-multi-thread", "fs"] }
pem = "4.0.0"
aws-config = "1.12.0"
aws-smithy-http-client = { version = "1.5.0", features = ["rustls-aws-lc"] }
aws-lc-rs = {version = "1.18.1"}
rand = "0.10.3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--generate-link-to-definition",
    "--generate-macro-expansion",
     "--cfg", "docsrs",
]

[features]
default = ["aws-lc-rs/aws-lc-sys"]
fips = ["aws-lc-rs/fips"]
track = []
kms = []
ddb = []
