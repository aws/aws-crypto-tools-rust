[package]
name = "aws-esdk"
version = "2.0.0"
edition = "2024"
keywords = ["cryptography", "security", "encryption"]
categories = ["cryptography"]
license = "ISC AND (Apache-2.0 OR ISC)"
description = "AWS Encryption SDK for Rust — client-side envelope encryption using the AWS Encryption SDK message format."
repository = "https://github.com/aws/aws-client-encryption-rust/aws-esdk/"
authors = ["AWS-CryptoTools"]
documentation = "https://docs.rs/crate/aws-esdk"
readme = "README.md"
autoexamples = false

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }

aws-smithy-types = "1.3.6"
aws-sdk-kms = "1.98.0"
aws-sdk-dynamodb = "1.103.0"
aws-crypto-mpl = { path = "../mpl" }
aws-mpl-primitives = { path = "../prim" }
aws-lc-rs = { version = "1.15.4", default-features = false }
async-trait = "0.1.83"
zeroize = "1.8.2"

# Necessary for examples
[dev-dependencies]
tokio = { version = "1.49.0", features = ["rt", "macros", "rt-multi-thread"] }
pem = "3.0.6"
aws-config = "1.8.12"
aws-lc-rs = {version = "1.15.4"}
rand = "0.9.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--generate-link-to-definition",
    "--generate-macro-expansion",
     "--cfg", "docsrs",
]

[features]
default = ["aws-lc-rs/aws-lc-sys"]
fips = ["aws-lc-rs/fips"]
track = []
kms = []
ddb = []
