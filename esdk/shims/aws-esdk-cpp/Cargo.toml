[package]
name = "aws-esdk-cpp"
version = "0.1.0"
edition = "2024"
keywords = ["crypto", "cryptography", "security", "encryption", "c++"]
categories = ["cryptography", "external-ffi-bindings"]
license = "Apache-2.0"
description = "C++ shim exposing the Rust implementation of the AWS Encryption SDK to C++ callers."
repository = "https://github.com/aws/aws-crypto-tools-rust"
authors = ["AWS-CryptoTools"]
documentation = "https://docs.rs/crate/aws-esdk-cpp"
readme = "README.md"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aws-crypto-mpl = { path = "../../../mpl", default-features = false }
aws-mpl-primitives = { path = "../../../prim", default-features = false }
cxx = "1.0.202"
tokio = {version = "1.49", features = ["full"] }
aws-esdk = { path = "../..", default-features = false }
aws-smithy-runtime = { version = "1.16", features = ["client", "default-https-client"], optional = true }
aws-smithy-runtime-api = { version = "1.19", features = ["client"], optional = true }

[features]
# The same features as the Rust ESDK, passed through to it.
default = ["aws-lc-sys", "kms", "ddb", "default-aws-sdk-clients", "rt-tokio"]
# The crypto backend: `aws-lc-sys` (the default), or `fips` for AWS-LC's FIPS module.
aws-lc-sys = ["aws-esdk/aws-lc-sys", "aws-crypto-mpl/aws-lc-sys", "aws-mpl-primitives/aws-lc-sys"]
fips = ["aws-esdk/fips", "aws-crypto-mpl/fips", "aws-mpl-primitives/fips"]
# The C++ API's KmsClient, DdbClient, KeyStore and HierarchicalKeyring.
# They need all three of these features, so turn them all on or all off.
kms = ["aws-esdk/kms", "aws-crypto-mpl/kms"]
ddb = ["aws-esdk/ddb", "aws-crypto-mpl/ddb"]
default-aws-sdk-clients = [
    "aws-esdk/default-aws-sdk-clients",
    "aws-crypto-mpl/default-aws-sdk-clients",
    "dep:aws-smithy-runtime",
    "dep:aws-smithy-runtime-api",
]
# The C++ API's DefaultCmc and StormTrackingCmc.
rt-tokio = ["aws-esdk/rt-tokio", "aws-crypto-mpl/rt-tokio"]

[build-dependencies]
cxx-build = "1.0.202"
cc = "1.6.0"

# Declare this crate as its own workspace root so cargo builds it standalone.
# Keep crates materialized under the test server's commons clone out of it.
[workspace]
exclude = ["test-server/.commons-clone"]
