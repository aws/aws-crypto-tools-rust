[package]
name = "aws-esdk-cpp"
version = "0.1.0"
edition = "2024"
keywords = ["crypto", "cryptography", "security", "encryption", "c++"]
categories = ["cryptography", "external-ffi-bindings"]
license = "Apache-2.0"
description = "C++ shim exposing the Rust implementation of the AWS Encryption SDK to C++ callers."
repository = "https://github.com/aws/aws-crypto-tools-rust"
authors = ["AWS-CryptoTools"]
documentation = "https://docs.rs/crate/aws-esdk-cpp"
readme = "README.md"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aws-crypto-mpl = { path = "../../../mpl" }
aws-mpl-primitives = { path = "../../../prim" }
cxx = "1.0.202"
tokio = {version = "1.49", features = ["full"] }
aws-esdk = { path = "../.." }
aws-smithy-runtime = { version = "1.16", features = ["client", "default-https-client"] }
aws-smithy-runtime-api = { version = "1.19", features = ["client"] }

[build-dependencies]
cxx-build = "1.0.202"
cc = "1.6.0"

# Declare this crate as its own workspace root so cargo builds it standalone
[workspace]
