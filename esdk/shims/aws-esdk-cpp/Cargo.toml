[package]
name = "aws-esdk-cpp"
version = "0.1.0"
edition = "2024"
keywords = ["crypto", "cryptography", "security", "encryption", "c++"]
categories = ["cryptography", "external-ffi-bindings"]
license = "ISC AND (Apache-2.0 OR ISC)"
description = "C++ shim exposing the Rust implementation of the AWS Encryption SDK to C++ callers."
repository = "https://github.com/aws/aws-crypto-tools-rust"
authors = ["AWS-CryptoTools"]
documentation = "https://docs.rs/crate/aws-esdk-cpp"
readme = "README.md"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aws-config = "1.8.12"
aws-mpl-legacy = { package = "aws-mpl-native", path = "../../../unsafe-unreviewed-mpl/mpl" }
aws-sdk-dynamodb = "1.103.0"
aws-sdk-kms = "1.98.0"
# Constraint only — this crate never calls aws-smithy-types. Pinned because
# aws-smithy-runtime 1.14.1 and aws-smithy-runtime-api 1.16.1 require
# aws-smithy-types ^1.7.0, while aws-config 1.12.0 (still the latest) caps
# aws-smithy-json at ^0.63.0, and aws-smithy-json 0.63.0 does not compile
# against aws-smithy-types 1.7.0. Holding types at 1.6.3 makes those newer
# siblings unselectable, which is what restores a buildable graph. The pin also
# reaches examples/custom-keyring, which resolves separately but depends on this
# crate by path.
#
# Remove once an aws-config requiring aws-smithy-json ^0.64 is released.
aws-smithy-types = "=1.6.3"
cxx = "1.0.194"
tokio = {version = "1.49.0", features = ["full"] }
aws-esdk = { path = "../.." }

[build-dependencies]
cxx-build = "1.0.194"
cc = "1.2.54"

# Declare this crate as its own workspace root so cargo builds it standalone
[workspace]
