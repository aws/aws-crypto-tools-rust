[package]
name = "esdk-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "esdk_benchmark"
path = "src/main.rs"

[dependencies]
aws-esdk = { path = ".." }
aws-crypto-mpl = { path = "../../mpl" }

tokio = { version = "1.49", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

clap = "4.6"
indicatif = "0.18"
rand = "0.10"
sysinfo = "0.39"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
memory-stats = "1.2"
futures = "0.3"

aws-config = "1.12.0"
aws-sdk-kms = "1.123.0"
aws-sdk-dynamodb = "1.130.0"
