'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

[[source]]
pattern = "./src/**/*.rs"

[[source]]
pattern = "./tests/**/*.rs"

# Specifications are read from the spec/ git submodule, pinned by the
# superproject gitlink to an exact commit. CI checks out that commit
# (submodules: true), so the report is generated against a fixed spec commit.
[[specification]]
source = "spec/data-format/message-header.md"

[[specification]]
source = "spec/data-format/message-footer.md"

[[specification]]
source = "spec/data-format/message-body.md"

[[specification]]
source = "spec/data-format/message-body-aad.md"

[[specification]]
source = "spec/data-format/message.md"

[[specification]]
source = "spec/client-apis/client.md"

[[specification]]
source = "spec/client-apis/decrypt.md"

[[specification]]
source = "spec/client-apis/encrypt.md"

[[specification]]
source = "spec/client-apis/streaming.md"

[[specification]]
source = "spec/client-apis/key-derivation.md"

[report.html]
enabled = true

# The CI duvet job uploads the HTML report as a build artifact and does not gate
# on coverage. Snapshot checking needs a committed snapshot, so it stays off.
[report.snapshot]
enabled = false
