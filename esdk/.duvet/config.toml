'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

[[source]]
pattern = "./src/**/*.rs"

[[source]]
pattern = "./tests/**/*.rs"

# The shared test-server Tests that run for Rust. Generated by
# `make -C test-server test-server-duvet`; see that target.
[[source]]
pattern = "./build/test-server-duvet/*.java"
type = "test"

[[specification]]
source = "spec/data-format/message-header.md"

[[specification]]
source = "spec/data-format/message-footer.md"

[[specification]]
source = "spec/data-format/message-body.md"

[[specification]]
source = "spec/data-format/message-body-aad.md"

[[specification]]
source = "spec/data-format/message.md"

[[specification]]
source = "spec/client-apis/client.md"

[[specification]]
source = "spec/client-apis/decrypt.md"

[[specification]]
source = "spec/client-apis/encrypt.md"

[[specification]]
source = "spec/client-apis/streaming.md"

[[specification]]
source = "spec/framework/transitive-requirements.md"

[report.html]
enabled = true

[report.snapshot]
enabled = false
