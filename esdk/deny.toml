# cargo-deny configuration for the aws-esdk project.
#
# Checks the esdk dependency graph on every PR (see
# .github/workflows/supply_chain.yml):
#   advisories - known security vulnerabilities (RustSec advisory DB)
#   bans       - banned and duplicate crates
#   licenses   - only the allowlisted licenses below
#   sources    - crates only from crates.io
#
# Run locally with `cargo deny check` or `make deny` from the esdk directory.

[advisories]
# Security advisories are errors. Add a RustSec ID here, with a rationale, only
# to grant a reviewed, temporary exception.
ignore = []

[licenses]
# Every license present in the esdk dependency graph today, restricted to
# permissive / OSI-approved licenses. Anything not listed fails the check.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "OpenSSL",
]

# `timeout` is MPL-2.0 (file-level copyleft), kept out of the global allowlist.
# This scoped exception permits MPL-2.0 for that one transitive crate.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "timeout"

[bans]
# The AWS SDK and async graph legitimately resolve several crates at multiple
# versions (e.g. http 0.2 and 1.x). Report duplicates without failing CI.
multiple-versions = "warn"
# The vendored aws-mpl-* crates are path dependencies of publishable crates;
# cargo-deny reports those as wildcards regardless of allow-wildcard-paths, so
# warn rather than fail. No dependency uses a registry wildcard (`*`) version.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
