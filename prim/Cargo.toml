[package]
name = "aws-mpl-primitives"
version = "0.1.0"
edition = "2024"
keywords = ["cryptography", "security", "encryption"]
categories = ["cryptography"]
license = "Apache-2.0"
description = "aws-mpl-primitives is a convenient wrapper for aws-lc-rs. Not intended for public consumption."
authors = ["AWS-CryptoTools"]
repository = "https://github.com/aws/aws-crypto-tools-rust"
readme = "README.md"

[dependencies]
aws-lc-rs = { version = "1.18.1", default-features = false }
# Verus specs and proofs. The verus! blocks compile to plain Rust under rustc.
vstd = "=0.0.0-2026-06-14-0213"

[package.metadata.verus]
verify = true

[features]
default = ["aws-lc-sys"]
# The crypto backend: `aws-lc-sys` (the default), or `fips` for AWS-LC's FIPS module.
# To use AWS-LC FIPS with MPL primitives, simply set `features = ["fips"]`.
aws-lc-sys = ["aws-lc-rs/aws-lc-sys"]
fips = ["aws-lc-rs/fips"]
[lints.rust]
# `verus_keep_ghost` is set by cargo-verus. Declared so rustc's cfg check
# accepts it: the ghost-only AsRef trait proxy in src/aws_lc_specs.rs (needed
# so Verus can name aws_lc_rs::aead::Aad<A: AsRef<[u8]>>) and the
# `sized_hierarchy` cfg_attr in src/lib.rs are compiled only under it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }
