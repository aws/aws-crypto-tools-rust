[package]
name = "aws-prim-test-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Hand-rolled rpcv2Cbor Language_Server for the Primitives TestServer, delegating to aws-mpl-primitives."

[[bin]]
name = "primitives-test-server"
path = "src/main.rs"

[dependencies]
aws-mpl-primitives = { path = ".." }
test-server-control = { path = "../../test-server-control" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.7"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(testserver_coverage)", "cfg(testserver_mutants)"] }
