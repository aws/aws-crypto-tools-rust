[package]
name = "aws-mpl-test-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Hand-rolled rpcv2Cbor Language_Server for the MPL TestServer, delegating to aws-crypto-mpl."

[[bin]]
name = "mpl-test-server"
path = "src/main.rs"

[dependencies]
aws-crypto-mpl = { path = ".." }
test-server-control = { path = "../../test-server-control", features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(testserver_coverage)", "cfg(testserver_mutants)"] }
