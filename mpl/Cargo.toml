[package]
name = "aws-crypto-mpl"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "aws-cryptographic-material-providers-library is a low level library for implementing client side encryption."
authors = ["AWS-CryptoTools"]

[dependencies]
async-trait = "=0.1.83"
aws-lc-rs = { version = "=1.17.0" }
base64 = "=0.22.1"
lru = "=0.18.1"
tokio = { version = "=1.41.1", features = ["rt", "time"], default-features = false }

[features]
default = []
test-utils = []

[dev-dependencies]
tokio = { version = "=1.41.1", features = ["rt", "macros"], default-features = false }
