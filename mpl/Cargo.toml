[package]
name = "aws-crypto-mpl"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "aws-cryptographic-material-providers-library is a low level library for implementing client side encryption."
authors = ["AWS-CryptoTools"]

[dependencies]
async-trait = "0.1.92"
aws-config = { version = "1.12.0", default-features = false, optional = true }
aws-mpl-primitives = { path = "../prim" }
aws-sdk-dynamodb = { version = "1.130.0", default-features = false, optional = true }
aws-sdk-kms = { version = "1.123.0", default-features = false, optional = true }
aws-smithy-runtime-api = { version = "1.19.0", features = ["client"] }
aws-smithy-types = "1.8.1"
aws-types = "1.6.0"
base64 = "0.23.1"
lru = "0.18.5"
time = { version = "0.3.55", default-features = false, features = ["std", "formatting", "macros"] }
tokio = { version = "1.49", features = ["rt", "time"], default-features = false }
uuid = { version = "1.27.0", features = ["v4"] }

[features]
default = ["kms", "ddb", "default-config"]
# The AWS KMS client. The hierarchical keyring and key store need `kms` and `ddb`.
kms = ["dep:aws-sdk-kms"]
# The Amazon DynamoDB client. The hierarchical keyring and key store need `kms` and `ddb`.
ddb = ["dep:aws-sdk-dynamodb"]
# Builds any KMS or DynamoDB client the key store is not given from the default AWS config chain,
# with the AWS SDK's default HTTPS client and tokio runtime.
# Without it, pass both clients to `KeyStoreClientBuilder`.
default-config = [
    "dep:aws-config",
    "aws-config/default",
    "aws-sdk-kms?/default-https-client",
    "aws-sdk-kms?/rt-tokio",
    "aws-sdk-dynamodb?/default-https-client",
    "aws-sdk-dynamodb?/rt-tokio",
]
test-utils = ["kms", "ddb"]

[dev-dependencies]
# Used only to construct AWS SDK errors for the classifier unit tests.
aws-smithy-runtime-api = { version = "1.19.0", features = ["http-1x"] }
# Used only by tests, as an implementation-independent digest oracle for the
# cache-identifier byte-layout assertions.
aws-lc-rs = "1.18.1"
tokio = { version = "1.49", features = ["rt", "macros", "test-util", "time"], default-features = false }
