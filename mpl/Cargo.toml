[package]
name = "aws-crypto-mpl"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "aws-cryptographic-material-providers-library is a low level library for implementing client side encryption."
authors = ["AWS-CryptoTools"]

[dependencies]
async-trait = "=0.1.83"
aws-config = "=1.8.12"
aws-lc-rs = { version = "=1.17.0", features = ["fips"] }
aws-sdk-dynamodb = "=1.103.0"
aws-sdk-kms = "=1.98.0"
base64 = "=0.22.1"
tokio = { version = "=1.41.1", features = ["rt", "macros", "time"], default-features = false }
uuid = { version = "=1.23.3", features = ["v4"] }

[features]
default = []
keystore = []

[[example]]
name = "aws_kms_hierarchical"
path = "examples/aws_kms_hierarchical/main.rs"
required-features = ["keystore"]

[dev-dependencies]
tokio = { version = "=1.41.1", features = ["rt", "macros", "test-util", "time"], default-features = false }
