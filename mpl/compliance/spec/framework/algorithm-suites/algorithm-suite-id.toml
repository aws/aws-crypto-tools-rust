# Algorithm Suite ID
#
# A 2-byte hex value that MUST uniquely identify an algorithm suite.
# This 2-byte value SHOULD be used to bind algorithm suites to ciphertext.

[[spec]]
level = "MUST"
quote = '''
A 2-byte hex value that MUST uniquely identify an algorithm suite.
'''

[[spec]]
level = "SHOULD"
quote = '''
This 2-byte value SHOULD be used to bind algorithm suites to ciphertext.
'''

