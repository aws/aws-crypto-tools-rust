# Smithy conformance config for aws-crypto-tools-rust: the model sources, and
# every deviation from the model with its reason. The checked crates are found
# by the script. Run from anywhere in the repo:
#   python3 scripts/smithy-conformance/conform.py

[smithy]
version = "1.74.1"
sha256 = "6b50c0b9f2443400bb7115b9badb54b3609816ec5fb4f625954eadd2f6b2f52a"

[[model]]
repo = "https://github.com/aws/aws-cryptographic-material-providers-library"
ref = "d34518bddb71e09790a734da08120093149252a3"
paths = [
  "model/traits.smithy",
  "ComAmazonawsKms/Model/kms/model.json",
  "ComAmazonawsDynamodb/Model/dynamodb/model.json",
  "AwsCryptographyPrimitives/Model",
  "AwsCryptographicMaterialProviders/dafny/AwsCryptographicMaterialProviders/Model",
  "AwsCryptographicMaterialProviders/dafny/AwsCryptographyKeyStore/Model",
]

[[model]]
repo = "https://github.com/aws/aws-encryption-sdk"
ref = "99f54cbc6945a5bad1b19d5412bbb9b5e457ff69"
paths = ["AwsEncryptionSDK/dafny/AwsEncryptionSdk/Model/esdk.smithy"]

[checks]
docs = true

[lint]
# fixed values stay const; getters and setters don't.
# AlgorithmSuite is a fixed table looked up from a suite ID, and the const
# enum methods (allows_for_encrypt, ...) read it.
const_ok = ["AlgorithmSuite"]

# ---------------------------------------------------------------------------
# Deviations. Every entry needs a reason. status:
#   accepted  - approved in review (default)
#   proposed  - drafted, not yet reviewed; still fails the run
#   deferred  - known, fix later; tracked, does not fail the run
# ---------------------------------------------------------------------------

# ---- Renames: where the Rust name differs from the model name ----

[[rename]]
shape = "aws.cryptography.keyStore#KeyStore"
example_strict = '''
let ks = KeyStore::from_conf(
    KeyStoreConfig::builder()
        .ddb_table_name("t").logical_key_store_name("t")
        .kms_configuration(kms).build()?,
)?;'''
example_ours = '''
let ks = DynamoDbKeyStore::builder()
    .ddb_table_name("t").logical_key_store_name("t")
    .kms_configuration(kms)
    .build().await?;'''
rust = "DynamoDbKeyStore"
reason = "The key store client is the DynamoDB key store; KeyStore is the trait customers implement."
what_differs = "The model calls the key store client KeyStore."
justification = "In Rust, KeyStore is the trait customers implement; the client is the DynamoDB one."
later = "breaking"
later_why = "Renaming the type later breaks callers of the old name."

