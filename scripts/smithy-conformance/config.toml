[[deviation]]
id = "variant_*:materialProviders#SymmetricSignatureAlgorithm$*"
reason = "Only HMAC-SHA384 exists; the model's HMAC(DigestAlgorithm) and None are folded into one variant plus Option."
what_differs = "The model has HMAC(digest) and None as a union."
justification = "Only HMAC-SHA384 exists; a new variant later is not breaking."
later = "breaking"
later_why = "Turning the enum into the model's union changes its variants."
[[deviation]]
id = "type_missing:encryptionSdk#*crypt*Input"
example_strict = '''
let input = EncryptInput::builder()
    .plaintext(data).keyring(keyring)
    .build()?;
esdk.encrypt().set_input(input).send().await?;'''
example_ours = '''
esdk.encrypt()
    .plaintext(data).keyring(keyring)
    .send().await?;
// EncryptInput exists, but only inside the crate'''
reason = "EncryptInput/DecryptInput are crate-private; callers use the fluent builders."
what_differs = "The model has public EncryptInput/DecryptInput types."
justification = "Callers only ever use the fluent builders; exposing the input types can be added later without breaking."
later = "not breaking"
later_why = "Making the input types public only adds API."
[[deviation]]
id = "type_missing:[ek][ne]*Exception"
example_strict = '''
match err {
    Error::InvalidEncryptionMaterials(e) => ..,
    Error::InvalidAlgorithmSuiteInfoOnEncrypt(e) => ..,
    Error::AwsCryptographicMaterialProvidersException(e) => ..,
    ..
}'''
example_ours = '''
match err {
    Error::InvalidMaterials(e) => ..,
    Error::Validation(e) => ..,
    Error::AccessDenied(e) => ..,
    ..   // one variant per kind of failure, not per modeled error
}'''
reason = "Errors are one categorical Error enum per crate, not one type per modeled error."
what_differs = "The model has one error type per failure (InvalidEncryptionMaterials, ...)."
