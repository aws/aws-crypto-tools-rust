id = "variant_type:keyStore#KMSConfiguration$kmsMRKeyArn"
reason = "config enum variants wrap a struct so they can gain fields."
what_differs = "The model puts a bare ARN string in the variant."
justification = "A struct can gain fields later without breaking callers; a string can't."
later = "breaking"
later_why = "Going back to a bare String changes the variant's payload."

[[deviation]]
id = "member_type:encryptionSdk#EncryptOutput$ciphertext"
example_strict = '''
let bytes: &[u8] = out.ciphertext();'''
example_ours = '''
let ct: &Ciphertext = out.ciphertext();
let bytes: &[u8] = ct.as_ref();   // or out.into_ciphertext().into_inner()'''
reason = "Ciphertext/Plaintext wrappers keep secrets out of Debug."
what_differs = "The model returns raw bytes."
justification = "The wrapper is still one .as_ref() away from bytes and keeps big buffers out of Debug output."
later = "breaking"
later_why = "Returning &[u8] instead of &Ciphertext changes the getter's type."
[[deviation]]
id = "member_type:encryptionSdk#DecryptOutput$plaintext"
reason = "Ciphertext/Plaintext wrappers keep secrets out of Debug."
what_differs = "The model returns raw bytes."
justification = "The wrapper keeps decrypted data out of Debug output and logs."
later = "breaking"
later_why = "Returning &[u8] instead of &Plaintext changes the getter's type."
[[deviation]]
id = "*:materialProviders#*Materials$algorithmSuite*"
example_strict = '''
EncryptionMaterials::builder()
    .algorithm_suite(AlgorithmSuiteInfo { id, encrypt, kdf, commitment, signature, .. })
    ...
let suite = materials.algorithm_suite();  // the info you passed in'''
example_ours = '''
EncryptionMaterials::builder()
    .algorithm_suite_id(EsdkAlgorithmSuiteId::AlgAes256GcmHkdfSha512CommitKey)
    ...
let id = materials.algorithm_suite_id();
let suite = materials.algorithm_suite();  // looked up from the id; can't disagree'''
reason = "Materials hold the suite ID; algorithm_suite() derives the full suite."
what_differs = "The model stores the full suite description in the materials."
justification = "The description follows from the ID; storing only the ID means the two can never disagree."
later = "breaking"
later_why = "Taking a full suite description instead of an ID changes the setter and getter."
[[deviation]]
id = "*:materialProviders#*CacheEntry*"
example_strict = '''
cmc.put_cache_entry()
    .identifier(id)
    .materials(materials)
    .creation_time(now).expiry_time(later)
    .messages_used(0).bytes_used(0)
    .send().await?;

match cmc.get_cache_entry().identifier(id).send().await {
    Ok(out) => use_it(out.materials()),
    Err(e) if e.is_entry_does_not_exist() => miss(),
    Err(e) => return Err(e),
}'''
example_ours = '''
cmc.put_cache_entry()
    .identifier(id)
    .entry(CacheEntry::builder()
        .materials(materials)
        .creation_time(now).expiry_time(later)
        .usage_metadata(usage)
        .build()?)
    .send().await?;

match cmc.get_cache_entry().identifier(id).send().await?.entry() {
    Some(entry) => use_it(entry.materials()),
    None => miss(),
}'''
reason = "Cache inputs/outputs wrap one CacheEntry instead of flat fields; a miss is None."
what_differs = "The model uses flat fields on put/get and an EntryDoesNotExist error for a miss."
justification = "A miss is a normal result, so it returns None, never an error; one CacheEntry carries the materials, times and usage together from put to get."
later = "breaking"
later_why = "Flat fields replace the entry setter and getter."
