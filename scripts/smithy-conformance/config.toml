[[deviation]]
id = "lint.renamed_reexport:aws_esdk::types::*"
example_strict = '''
use aws_esdk::types::EsdkAlgorithmSuiteId;
esdk.encrypt().algorithm_suite_id(EsdkAlgorithmSuiteId::AlgAes256GcmHkdfSha512CommitKey)'''
example_ours = '''
use aws_esdk::types::AlgorithmSuiteId;   // the same type, shorter name
esdk.encrypt().algorithm_suite_id(AlgorithmSuiteId::AlgAes256GcmHkdfSha512CommitKey)'''
reason = "ESDK callers write AlgorithmSuiteId and CommitmentPolicy; they are the MPL's EsdkAlgorithmSuiteId and EsdkCommitmentPolicy."
what_differs = "The ESDK re-exports EsdkAlgorithmSuiteId as AlgorithmSuiteId (and the commitment policy too)."
justification = "ESDK callers only ever see ESDK suites and policies, so the shorter name drops a prefix that tells them nothing."
later = "breaking"
later_why = "Removing the AlgorithmSuiteId name breaks callers; adding EsdkAlgorithmSuiteId next to it would not."

