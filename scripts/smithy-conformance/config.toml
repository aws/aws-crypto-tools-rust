[[deviation]]
id = "*:primitives#*"
example_strict = '''
let prim = AtomicPrimitives::from_conf(CryptoConfig::builder().build()?)?;
let out = prim.aes_encrypt()
    .enc_alg(AesGcm::Aes256Gcm)
    .iv(iv).key(key).msg(msg).aad(aad)
    .send()?;
let ciphertext = out.cipher_text();'''
example_ours = '''
let mut ciphertext = Vec::new();
aws_mpl_primitives::aes_encrypt(
    AesGcm::Aes256Gcm, &iv, &key, &msg, &aad, &mut ciphertext,
)?;'''
reason = "the prim crate can be plain functions; it does not have to be a client."
what_differs = "The model wraps every primitive in a client with input/output structs."
justification = "The primitives are internal building blocks; plain functions are simpler and nothing outside the crates calls them."
later = "not breaking"
later_why = "A primitives client could be added next to the functions."

[[deviation]]
id = "variant_type:keyStore#KMSConfiguration$kmsKeyArn"
example_strict = '''
KmsConfiguration::KmsKeyArn("arn:aws:kms:...".to_string())

// can never take a second setting'''
example_ours = '''
KmsConfiguration::KmsKeyArn(
    KmsKeyArn::builder().arn("arn:aws:kms:...").build()?,
)
// or the shortcut
KmsConfiguration::kms_key_arn("arn:aws:kms:...")'''
reason = "config enum variants wrap a struct so they can gain fields."
what_differs = "The model puts a bare ARN string in the variant."
justification = "A struct can gain fields later without breaking callers; a string can't."
later = "breaking"
later_why = "Going back to a bare String changes the variant's payload."
