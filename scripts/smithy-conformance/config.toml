id = "variant_missing:materialProviders#*$DBE"
reason = "DB-ESDK suites and policies are not ported yet."
what_differs = "The model includes DB-ESDK suites and policies."
justification = "Not ported yet; adding a variant later is not breaking because the enums are non_exhaustive."
