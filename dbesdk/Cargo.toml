[package]
name = "aws-db-esdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Rust AWS Database Encryption SDK for DynamoDB (DB-ESDK)."
authors = ["AWS-CryptoTools"]

[dependencies]
uuid = { version = "1", features = ["v4"] }
# Same crypto provider the native MPL crate uses. No `fips` feature: the
# conformance round-trip needs standard AES-GCM / HKDF / HMAC, and the non-FIPS
# build avoids the heavier FIPS toolchain.
aws-lc-rs = "=1.17.0"
