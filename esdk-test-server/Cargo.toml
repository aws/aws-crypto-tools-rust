# The ESDK TestServer Rust Language_Server. A hand-rolled rpcv2Cbor HTTP server
# that speaks the single source-of-truth Smithy model owned by
# aws-crypto-tools-commons (esdk/test-server/model) and delegates each operation
# to the real AWS Encryption SDK for Rust (aws-esdk) built from this repo's head.
#
# It lives at the repo top level (not under esdk/) so it is not swept into the
# esdk library's coverage-gated CI; it has its own workflow.
[package]
name = "aws-esdk-test-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Hand-rolled rpcv2Cbor Language_Server for the ESDK TestServer, delegating to aws-esdk."

[[bin]]
name = "esdk-test-server"
path = "src/main.rs"

[dependencies]
# Real product SDK under test, from this repo's head of main.
aws-esdk = { path = "../esdk" }
# The vendored MPL, aliased exactly as aws-esdk aliases it, so keyring/commitment
# types line up across the crates.
aws-mpl-legacy = { package = "aws-mpl-native", path = "../unsafe-unreviewed-mpl/mpl" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.7"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
