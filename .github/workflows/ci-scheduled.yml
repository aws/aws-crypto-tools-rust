# Runs all of CI every day at 15:00 UTC (8AM PDT). Dependencies (no Cargo.lock
# is committed), the stable toolchain, and the other languages' TestServers
# change without a push to this repo; this run catches the breaks they cause.
#
# A failed scheduled run opens a "Daily CI failing" issue, or comments on the
# open one. The next passing scheduled run closes it.
name: Daily CI

on:
  schedule:
    - cron: "00 15 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    # Don't run the cron builds on forks
    if: github.event_name != 'schedule' || github.repository_owner == 'aws'
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      scope: all
    secrets: inherit

  report:
    needs: ci
    if: >-
      always() && github.event_name == 'schedule' &&
      contains(fromJSON('["success","failure"]'), needs.ci.result)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.ci.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Daily CI failing"
          issue=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")

          if [[ "$RESULT" == "success" ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "Daily CI passed: $RUN_URL"
            fi
          elif [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "Daily CI failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "Daily CI failed: $RUN_URL"
          fi
