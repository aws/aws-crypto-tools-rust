# Assert that every line of executable code added or changed in the PR is covered by tests.
# There is no minimum bar for the project's total coverage.
name: Library C++ Shim Coverage

on:
  workflow_call:

jobs:
  patchCoverage:
    name: cpp shim patch coverage
    runs-on: codebuild-CryptoToolsCI-linux-aws-crypto-tools-rust-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          # diff-cover needs the base branch history
          fetch-depth: 0

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          workspaces: esdk/shims/aws-esdk-cpp

      # The C++ side must be compiled by the clang whose LLVM major matches
      # rustc's, so the profile runtime writes the profraw version that
      # rustc's llvm-profdata expects.
      - name: Install clang matching rustc's LLVM
        run: |
          set -euo pipefail
          llvm_major=$(rustc -vV | sed -n 's/^LLVM version: \([0-9][0-9]*\).*/\1/p')
          test -n "$llvm_major"
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$llvm_major"
          echo "CC=clang-$llvm_major" >> "$GITHUB_ENV"
          echo "CXX=clang++-$llvm_major" >> "$GITHUB_ENV"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install diff-cover
        run: pip install diff-cover==9.7.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2
          role-session-name: CppShimCoverage
          special-characters-workaround: "true"

      - name: Generate line coverage
        working-directory: esdk/shims/aws-esdk-cpp
        env:
          # Drop debug info to save RAM
          RUSTFLAGS: "-C debuginfo=0"
          ESDK_TEST_KMS_KEY_ARN: arn:aws:kms:us-west-2:370957321024:key/9d989aa2-2f9c-438c-a745-cc57d3ad0126
          ESDK_TEST_DDB_TABLE: KeyStoreDdbTable
          ESDK_TEST_LOGICAL_KEYSTORE: KeyStoreDdbTable
          ESDK_TEST_BRANCH_KEY_ID: 3ce7656b-e166-40f3-8c9b-a920ce6596cd
          ESDK_TEST_REGION: us-west-2
        run: make coverage-cpp COV_CPP_REPORT="report --lcov --output-path lcov.info"

      # Diff PR coverage against base branch coverage
      - name: Re-root coverage paths to the repository root
        run: |
          set -euo pipefail
          lcov='esdk/shims/aws-esdk-cpp/lcov.info'
          # Absolute workspace paths become repo-relative; paths that were
          # already relative get the shim directory prefix. The t branch
          # keeps each SF line from matching both rules.
          sed -i \
            -e "s|^SF:${GITHUB_WORKSPACE}/|SF:|" -e t \
            -e 's|^SF:\([^/]\)|SF:esdk/shims/aws-esdk-cpp/\1|' \
            "$lcov"
          missing=0
          while IFS= read -r f; do
            if [[ ! -f "$f" ]]; then
              echo "lcov references a path that does not exist from the repository root: $f"
              missing=1
            fi
          done < <(sed -n 's|^SF:||p' "$lcov" | sort -u)
          exit "$missing"

      - name: Enforce 100% patch coverage
        run: diff-cover 'esdk/shims/aws-esdk-cpp/lcov.info' --compare-branch 'origin/${{ github.base_ref }}' --fail-under 100
