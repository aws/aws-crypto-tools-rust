# This workflow runs for every pull request.
#
# This is a monorepo containing multiple projects. To avoid running every
# project's CI on every PR, we detect which project directories changed and
# only run the relevant CI. The rules are:
#
#   * If `mpl/` is modified, run CI for ALL projects. MPL is the shared
#     foundation that every other project depends on, so a change there can
#     affect anything downstream.
#   * If shared infrastructure changes (the CI workflows themselves, the
#     `spec` submodule pointer, or `.gitmodules`), also run CI for all
#     projects, since those changes can affect every project.
#   * Otherwise, run CI only for the project directories that changed.
name: PR CI

on:
  pull_request:

# Concurrency control helps free up runners faster and speed up development.
# When new commits are pushed in PR, the previous workflow run is cancelled.
# If you want to not cancel previous workflow then remove this in you PR temporarily. Before merging to main add it back.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # Determine which projects need CI based on the files changed in the PR.
  # Emits `projects`: a JSON array of project directory names to test, e.g.
  # ["mpl","esdk"]. Only projects that actually exist in the tree are emitted,
  # so the fan-out scales automatically as new projects are added.
  detect-changes:
    name: Detect changed projects
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # dorny/paths-filter calls the GitHub "list PR files" API on
      # pull_request events, which requires pull-requests: read.
      pull-requests: read
    outputs:
      projects: ${{ steps.set.outputs.projects }}
    steps:
      - uses: actions/checkout@v6

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mpl:
              - 'mpl/**'
            esdk:
              - 'esdk/**'
            prim:
              - 'prim/**'
            aws_structured_encryption:
              - 'aws_structured_encryption/**'
            db-esdk:
              - 'db-esdk/**'
            s3ec:
              - 's3ec/**'
            shared:
              - '.github/workflows/**'
              - 'spec'
              - '.gitmodules'
              - 'errors.toml'
              - 'xtask/**'

      - name: Compute project matrix
        id: set
        shell: bash
        env:
          MPL: ${{ steps.filter.outputs.mpl }}
          ESDK: ${{ steps.filter.outputs.esdk }}
          PRIM: ${{ steps.filter.outputs.prim }}
          SE: ${{ steps.filter.outputs.aws_structured_encryption }}
          DBESDK: ${{ steps.filter.outputs.db-esdk }}
          S3EC: ${{ steps.filter.outputs.s3ec }}
          SHARED: ${{ steps.filter.outputs.shared }}
        run: |
          set -euo pipefail

          # The full set of projects this monorepo expects to host.
          all=(esdk mpl prim aws_structured_encryption db-esdk s3ec)

          selected=()
          # Only add a project if it actually exists in the tree (has a
          # Cargo.toml). This keeps the matrix free of projects that have not
          # been checked in yet.
          add() {
            if [[ -f "$1/Cargo.toml" ]]; then
              selected+=("$1")
            else
              echo "Skipping '$1': no $1/Cargo.toml in tree yet."
            fi
          }

          if [[ "$MPL" == "true" || "$SHARED" == "true" ]]; then
            echo "MPL or shared infrastructure changed -> running all projects."
            for p in "${all[@]}"; do
              add "$p"
            done
          else
            if [[ "$ESDK"   == "true" ]]; then add esdk; fi
            if [[ "$PRIM"   == "true" ]]; then add prim; fi
            if [[ "$SE"     == "true" ]]; then add aws_structured_encryption; fi
            if [[ "$DBESDK" == "true" ]]; then add db-esdk; fi
            if [[ "$S3EC"   == "true" ]]; then add s3ec; fi
          fi

          if [[ ${#selected[@]} -eq 0 ]]; then
            projects='[]'
          else
            projects=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -cs .)
          fi

          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Selected projects: $projects"

  # Run the reusable Rust test workflow once per selected project. If no
  # relevant project changed, the matrix is empty and this job is skipped.
  pr-ci-rust:
    needs: detect-changes
    if: needs.detect-changes.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect-changes.outputs.projects) }}
    uses: ./.github/workflows/library_rust_tests.yml
    with:
      project: ${{ matrix.project }}

  # Run duvet and upload the compliance report for projects that have duvet
  # configured. Currently that is esdk only; add a job per project as more
  # projects gain a .duvet/config.toml.
  pr-ci-duvet:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.projects), 'esdk')
    uses: ./.github/workflows/duvet.yml
    with:
      project: esdk

  # Check that the generated error types files match the errors.toml definitions.
  gen-errors:
    name: Generated error types are current
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --manifest-path xtask/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

      - name: Test the generator
        run: cargo test --manifest-path xtask/Cargo.toml

      - name: Check the generated files
        run: cargo xtask gen-errors --check

  # Fail a PR that changes a published crate's API in a way its version number does not allow.
  # Each crate is compared with its newest release on crates.io; a crate with no release yet is skipped.
  semver-checks:
    name: semver-checks (${{ matrix.crate }})
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: aws-mpl-primitives, dir: prim, first-release: 0.0.0 }
          - { crate: aws-crypto-mpl, dir: mpl, first-release: 0.0.0 }
          # aws-esdk 1.x on crates.io is the Dafny-based implementation, with a different API.
          - { crate: aws-esdk, dir: esdk, first-release: 2.0.0 }
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Find the release to compare with
        id: baseline
        env:
          CRATE: ${{ matrix.crate }}
          FIRST_RELEASE: ${{ matrix.first-release }}
        run: |
          set -euo pipefail
          versions=$(curl -sf -A "aws-crypto-tools-rust CI" "https://crates.io/api/v1/crates/${CRATE}/versions" \
            | jq -r '.versions[] | select(.yanked | not) | .num' || true)
          baseline=""
          for v in $versions; do
            # Keep releases at or after FIRST_RELEASE; `sort -V -C` succeeds when its input is in order.
            if printf '%s\n%s\n' "$FIRST_RELEASE" "$v" | sort -V -C; then
              baseline=$(printf '%s\n%s\n' "$baseline" "$v" | sed '/^$/d' | sort -V | tail -n1)
            fi
          done
          if [ -z "$baseline" ]; then
            echo "::notice::${CRATE} has no release at or after ${FIRST_RELEASE}; skipping."
          fi
          echo "version=${baseline}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.baseline.outputs.version != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-semver-checks
        if: steps.baseline.outputs.version != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Check against ${{ matrix.crate }} ${{ steps.baseline.outputs.version }}
        if: steps.baseline.outputs.version != ''
        run: >-
          cargo semver-checks
          --manifest-path ${{ matrix.dir }}/Cargo.toml
          --baseline-version ${{ steps.baseline.outputs.version }}
          --default-features

  # Single stable required status check for branch protection. It passes when
  # every needed job either succeeded or was legitimately skipped. `pr-ci-rust`
  # is allowed to skip so that PRs touching no project still pass this gate.
  pr-ci-all-required:
    if: always()
    needs:
      - detect-changes
      - pr-ci-rust
      - pr-ci-duvet
      - gen-errors
      - semver-checks
    runs-on: ubuntu-22.04
    steps:
      - name: Verify all required jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: pr-ci-rust, pr-ci-duvet
