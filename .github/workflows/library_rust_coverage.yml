# Assert that every line of executable code added or changed in the PR is covered by tests.
# There is no minimum bar for the project's total coverage.
name: Library Rust Coverage

on:
  workflow_call:
    inputs:
      project:
        description: "Project subdirectory to measure (e.g. mpl, esdk)."
        required: true
        type: string
      test-server-report:
        description: "Artifact of a TestServer run in this workflow run whose coverage/rust.lcov also counts. Empty for none."
        required: false
        type: string
        default: ""

jobs:
  patchCoverage:
    name: ${{ inputs.project }} patch coverage
    runs-on: codebuild-CryptoToolsCI-linux-aws-crypto-tools-rust-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          workspaces: ${{ inputs.project }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install diff-cover
        run: pip install diff-cover==9.7.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2
          role-session-name: RustCoverage
          special-characters-workaround: "true"

      # build `prim` without `all-features`; otherwise it tests with FIPS.
      # FIPS adds nothing for line coverage and is heavier to build.
      - name: Choose feature flags
        run: |
          if [ '${{ inputs.project }}' = 'prim' ]; then
            echo "FEATURE_FLAGS=" >> "$GITHUB_ENV"
          else
            echo "FEATURE_FLAGS=--all-features" >> "$GITHUB_ENV"
          fi

      - name: Generate line coverage
        working-directory: ${{ inputs.project }}
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: cargo llvm-cov $FEATURE_FLAGS --workspace --lcov --remap-path-prefix --output-path lcov.info --verbose

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Check out the commons per-test coverage tool
        uses: actions/checkout@v6
        with:
          repository: aws/aws-crypto-tools-commons
          ref: lucmcdon/test-server-per-test-coverage
          path: commons
          sparse-checkout: test-server-common/tools

      # nextest runs each test in its own process, and the runner gives each
      # one its own profile file. The build is the one cargo llvm-cov just made.
      - name: Record the lines each test runs
        working-directory: ${{ inputs.project }}
        env:
          RUSTFLAGS: "-C debuginfo=0"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: python3 ${{ github.workspace }}/commons/test-server-common/tools/per_test_coverage.py run-test
          PER_TEST_COVERAGE_DIR: ${{ runner.temp }}/per-test-raw
          PER_TEST_REPOSITORY: ${{ github.repository }}
          PER_TEST_ROOT: ${{ github.workspace }}
        run: cargo llvm-cov nextest $FEATURE_FLAGS --workspace --no-report --no-fail-fast

      - name: Write the per-test line coverage
        run: python3 commons/test-server-common/tools/per_test_coverage.py build "$RUNNER_TEMP/per-test-raw" "$RUNNER_TEMP/per-test-coverage/per-test-coverage"

      - name: Upload the per-test line coverage
        uses: actions/upload-artifact@v7
        with:
          name: per-test-coverage-${{ inputs.project }}
          path: ${{ runner.temp }}/per-test-coverage
          if-no-files-found: error

      # Diff PR coverage against base branch coverage
      - name: Re-root coverage paths to the repository root
        run: |
          set -euo pipefail
          sed -i 's|^SF:|SF:${{ inputs.project }}/|' '${{ inputs.project }}/lcov.info'
          missing=0
          while IFS= read -r f; do
            if [[ ! -f "$f" ]]; then
              echo "lcov references a path that does not exist from the repository root: $f"
              missing=1
            fi
          done < <(sed -n 's|^SF:||p' '${{ inputs.project }}/lcov.info' | sort -u)
          exit "$missing"

      # The test server dashboard merges this report, line by line, with the
      # coverage the cross-language test server gives the same commit.
      - name: Write the line coverage report
        run: |
          mkdir -p "$RUNNER_TEMP/local-coverage"
          cp '${{ inputs.project }}/lcov.info' "$RUNNER_TEMP/local-coverage/${{ inputs.project }}.lcov"

      - name: Upload the line coverage report
        uses: actions/upload-artifact@v7
        with:
          name: local-coverage-${{ inputs.project }}
          path: ${{ runner.temp }}/local-coverage/${{ inputs.project }}.lcov
          if-no-files-found: error

      # The cross-language TestServer runs this project's code too, so its line
      # coverage of the Rust server counts toward the gate.
      # Its lcov paths are already relative to the repository root.
      - name: Download the TestServer's line coverage
        if: inputs.test-server-report != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.test-server-report }}
          path: ${{ runner.temp }}/test-server-report

      # diff-cover counts a line as covered when any report covers it.
      # The TestServer report also measures the test servers' own source,
      # which is not library code (ci.yml's library filters skip it too),
      # so the gate leaves test-server files out.
      - name: Enforce 100% patch coverage
        run: |
          set -euo pipefail
          reports=('${{ inputs.project }}/lcov.info')
          if [ -d "$RUNNER_TEMP/test-server-report" ]; then
            while IFS= read -r f; do reports+=("$f"); done < <(find "$RUNNER_TEMP/test-server-report" -path '*/coverage/rust.lcov')
          fi
          echo "Coverage reports: ${reports[*]}"
          diff-cover "${reports[@]}" --exclude '*/test-server/*' --compare-branch 'origin/${{ github.base_ref }}' --fail-under 100
