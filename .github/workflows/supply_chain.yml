# Runs cargo-deny for a single project (subdirectory).
# This checks the project's dependencies for security advisories, bans, etc.
# and fails (denies) if there are issues.
name: Supply Chain

on:
  workflow_call:
    inputs:
      project:
        description: "Project subdirectory to check (e.g. esdk)."
        required: true
        type: string

jobs:
  cargo-deny:
    name: cargo-deny (${{ inputs.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      # The RustSec advisory database updates independently of this repo,
      # so a newly published advisory could turn this red without any code change.
      # Run it on every PR for visibility, but do not block merges on it.
      - name: cargo deny check advisories (non-blocking)
        continue-on-error: true
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check advisories

      - name: cargo deny check bans licenses sources
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check bans licenses sources
