# Reusable workflow: run cargo-deny for each project in `projects`, a JSON array of directories (e.g. ["mpl","esdk"]).
# This checks each project's dependencies for security advisories, bans, etc.
# and fails (denies) if there are issues.
name: Supply Chain

on:
  workflow_call:
    inputs:
      projects:
        description: "JSON array of project subdirectories to check (e.g. [\"mpl\",\"esdk\"])."
        required: true
        type: string

jobs:
  cargo-deny:
    name: ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
    runs-on: codebuild-CryptoToolsCI-linux-aws-crypto-tools-rust-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: 'true'

      # The CodeBuild runner image has no Rust toolchain, and cargo-deny runs as a cargo subcommand.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny

      # The RustSec advisory database updates independently of this repo,
      # so a newly published advisory could turn this red without any code change.
      # Run it on every PR for visibility, but do not block merges on it.
      - name: cargo deny check advisories (non-blocking)
        continue-on-error: true
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check advisories

      - name: cargo deny check bans licenses sources
        run: cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check bans licenses sources
