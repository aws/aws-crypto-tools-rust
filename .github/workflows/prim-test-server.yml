# Separate from the library CI (pull.yml) so this crate is not swept into the
# coverage-gated library jobs.
name: Primitives TestServer (Rust)

on:
  pull_request:
    paths:
      - "prim-test-server/**"
      - "prim/**"
      - ".github/workflows/prim-test-server.yml"
  push:
    branches:
      - main
    paths:
      - "prim-test-server/**"
      - "prim/**"
      - ".github/workflows/prim-test-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-language-server:
    name: build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prim-test-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # aws-lc-sys (via aws-mpl-primitives) needs Go to build its native code
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: prim-test-server

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  # The cross-language TestServer run, from the shared commons workflow. This
  # checkout supplies the rust server; every other server comes from its
  # configured branch. Only the pairs involving rust run; the full matrix runs in commons.
  test-server:
    name: TestServer
    permissions:
      contents: read
      actions: read
    uses: aws/aws-crypto-tools-commons/.github/workflows/primitives-test-server-reusable.yml@main
    with:
      focus: rust
      checkout-languages: rust
    secrets:
      repo-pat: ${{ secrets.COMMONS_REPO_PAT }}
