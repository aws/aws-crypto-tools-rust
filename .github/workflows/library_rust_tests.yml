# Reusable workflow that builds and tests a single project (subdirectory) in
# the monorepo. Callers pass the project directory name via the `project`
# input (e.g. "mpl"). All cargo commands run scoped to that subdirectory.
name: Library Rust Tests

on:
  workflow_call:
    inputs:
      project:
        description: "Project subdirectory to build and test (e.g. mpl, esdk)."
        required: true
        type: string

jobs:
  testRust:
    name: ${{ inputs.project }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - name: Support longpaths on Git checkout
        run: git config --global core.longpaths true
        working-directory: .

      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      # Required by aws-lc-fips-sys: its CMake build invokes Go to generate
      # FIPS module artifacts. GitHub-hosted runners do not put `go` on PATH
      # for this workflow by default.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.project }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test + line coverage gate (100%)
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 100 --verbose

      # TODO(integ-tests-creds): Wire up AWS credentials before uncommenting
      # the steps below.
      #
      # The keystore integ tests in
      #   mpl/tests/test_keystore_branch_key_store_integ.rs
      # are #[ignore]'d by default and exercise the BranchKeyStore read
      # path against real AWS. They need read access to:
      #   * DynamoDB table `KeyStoreDdbTable` in account 370957321024
      #     (us-west-2)
      #   * KMS keys in account 370957321024 (us-west-2) and account
      #     658956600833 (us-east-1, us-west-2, ap-south-2)
      #
      # Recommended approach: OIDC role assumption via
      # aws-actions/configure-aws-credentials@v5. `id-token: write` is
      # already granted on the caller workflow (.github/workflows/pull.yml)
      # and on the `testRust` job above.
      #
      # When uncommenting, also extend the matrix or add a separate
      # `if:` if more than mpl ends up needing real-AWS integ tests.
