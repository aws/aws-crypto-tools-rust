      #   if: inputs.project == 'mpl'
      #   env:
      #     MPL_EXAMPLE_KEY_STORE_TABLE: ${{ vars.MPL_EXAMPLE_KEY_STORE_TABLE }}
      #     MPL_EXAMPLE_LOGICAL_KEY_STORE_NAME: ${{ vars.MPL_EXAMPLE_LOGICAL_KEY_STORE_NAME }}
      #     MPL_EXAMPLE_KMS_KEY_ARN: ${{ vars.MPL_EXAMPLE_KMS_KEY_ARN }}
