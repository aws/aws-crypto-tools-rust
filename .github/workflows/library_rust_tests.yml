# Reusable workflow: build and test each project in `projects`, a JSON array of directories (e.g. ["mpl","esdk"]).
name: Library Rust Tests

on:
  workflow_call:
    inputs:
      projects:
        description: "JSON array of project subdirectories to build and test (e.g. [\"mpl\",\"esdk\"])."
        required: true
        type: string

jobs:
  testRust:
    name: ${{ matrix.project }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
        os: [ubuntu, macos, windows]
    runs-on: ${{ matrix.os }}-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Support longpaths on Git checkout
        run: git config --global core.longpaths true
        working-directory: .

      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      # aws-lc-sys / aws-lc-fips-sys build AWS-LC with NASM (Netwide Assembler) on Windows.
      # NASM is not on the Windows runner PATH by default but Unix runners already provide an assembler.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt, llvm-tools-preview
          workspaces: ${{ matrix.project }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      # KMS-backed integration tests (e.g. tests/test_encrypt_decrypt.rs) call
      # kms:GenerateDataKey / kms:Decrypt against the shared AWS Crypto Tools
      # test keys in us-west-2, so CI must have AWS credentials. Assume the
      # shared public ESDK CI role via GitHub OIDC (the job already requests
      # `id-token: write`). This is the same role and pattern the existing
      # aws/aws-encryption-sdk `library_rust_tests.yml` uses. The role ARN is
      # public (no repo secret needed); access is gated by the role's OIDC
      # trust policy, which must permit `repo:aws/aws-crypto-tools-rust:*`.
      - name: Configure AWS Credentials
        if: matrix.project != 'db-esdk'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2
          role-session-name: RustTests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      # db-esdk's tests and examples also reach the DB-ESDK DynamoDB test tables,
      # so it uses the CI role aws-database-encryption-sdk-dynamodb uses.
      - name: Configure AWS Credentials (DB-ESDK)
        if: matrix.project == 'db-esdk'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-DDBEC-Dafny-Role-us-west-2
          role-session-name: DDBEC-Dafny-Rust-Tests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - name: Format check
        run: cargo fmt --all -- --check

      # Match the coverage step's features so clippy lints feature-gated tests.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy every feature combination
        run: >-
          cargo hack clippy --lib --feature-powerset --no-dev-deps
          --exclude-features default
          --mutually-exclusive-features aws-lc-sys,fips
          --at-least-one-of aws-lc-sys,fips
          -- -D warnings

      - name: Clippy with default features plus fips
        run: cargo clippy --lib --features fips -- -D warnings

      # Broken intra-doc links and other rustdoc warnings fail the build.
      # Docs don't vary by OS, so only Linux builds them.
      - name: Docs
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Build
        run: cargo build --verbose

      - name: Run examples
        if: matrix.project == 'esdk' || matrix.project == 'db-esdk'
        run: make examples

      # Line coverage does not need debug info, so build the coverage binaries
      # with `-C debuginfo=0`. They are large (aws-lc-sys + aws-lc-fips-sys,
      # coverage-instrumented); dropping debug info keeps the ubuntu link within
      # the hosted runner's memory. Harmless on macOS.
      #
      # Default features, not `--all-features`: `--all-features` turns on `fips`,
      # which replaces the default backend.
      #
      # TODO(esdk): esdk line-coverage gate is temporarily 80% (esdk is ~81%
      # today); raise it toward 100 as coverage fills in.
      # TODO(mpl): mpl line-coverage is temporarily 80%
      # raise it to 100 as coverage fills in.
      - name: Test + line coverage gate
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: cargo llvm-cov --workspace --fail-under-lines 80 --verbose

      # FIPS parity check for `prim`. `--no-default-features` is required to get
      # a FIPS-only build: `--features fips` alone leaves `default` enabled, so
      # both `aws-lc-sys` and `aws-lc-fips-sys` get compiled and only the latter
      # is used. Test-only — the coverage gate above already covers these lines
      # against the default backend, so this step exists to prove the same code
      # passes when linked against AWS-LC-FIPS.
      # Needs Go, which setup-rust installs.
      # Windows also needs the NASM step above.
      - name: Test FIPS-only backend
        if: matrix.project == 'prim'
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: cargo test --no-default-features --features fips --verbose
