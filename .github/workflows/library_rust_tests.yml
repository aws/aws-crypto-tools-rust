# Reusable workflow that builds and tests a single project (subdirectory) in
# the monorepo. Callers pass the project directory name via the `project`
# input (e.g. "mpl"). All cargo commands run scoped to that subdirectory.
name: Library Rust Tests

on:
  workflow_call:
    inputs:
      project:
        description: "Project subdirectory to build and test (e.g. mpl, esdk)."
        required: true
        type: string

jobs:
  testRust:
    name: ${{ inputs.project }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os == 'macos-latest' && format('codebuild-CryptoToolsCI-macos-aws-crypto-tools-rust-{0}-{1}', github.run_id, github.run_attempt) || format('codebuild-CryptoToolsCI-linux-aws-crypto-tools-rust-{0}-{1}', github.run_id, github.run_attempt) }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - name: Support longpaths on Git checkout
        run: git config --global core.longpaths true
        working-directory: .

      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      # Required by aws-lc-fips-sys: its CMake build invokes Go to generate
      # FIPS module artifacts. GitHub-hosted runners do not put `go` on PATH
      # for this workflow by default.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # KMS-backed integration tests (e.g. tests/test_encrypt_decrypt.rs) call
      # kms:GenerateDataKey / kms:Decrypt against the shared AWS Crypto Tools
      # test keys in us-west-2, so CI must have AWS credentials. Assume the
      # shared public ESDK CI role via GitHub OIDC (the job already requests
      # `id-token: write`). This is the same role and pattern the existing
      # aws/aws-encryption-sdk `library_rust_tests.yml` uses. The role ARN is
      # public (no repo secret needed); access is gated by the role's OIDC
      # trust policy, which must permit `repo:aws/aws-crypto-tools-rust:*`.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2
          role-session-name: RustTests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.project }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      # Line coverage does not need debug info, so build the coverage binaries
      # with `-C debuginfo=0`. They are large (aws-lc-sys + aws-lc-fips-sys,
      # coverage-instrumented); dropping debug info keeps the ubuntu link within
      # the hosted runner's memory. Harmless on macOS.
      #
      # `prim` is deliberately excluded from `--all-features`. Its only
      # non-default feature is `fips`, and `aws-lc-rs` treats `fips` as an
      # override rather than an addition: with both features on it links
      # `aws-lc-fips-sys` and ignores `aws-lc-sys`. Running coverage with
      # `--all-features` would therefore measure the FIPS backend and leave the
      # default (non-FIPS) backend that actually ships untested. `prim` has no
      # `cfg(feature = ...)` code, so dropping `--all-features` costs no
      # coverage — the FIPS backend gets its own parity step below.
      #
      # TODO(esdk): esdk line-coverage gate is temporarily 80% (esdk is ~81%
      # today); raise it toward 100 as coverage fills in.
      # TODO(mpl): mpl line-coverage is temporarily 80%
      # raise it to 100 as coverage fills in.
      - name: Test + line coverage gate
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: cargo llvm-cov ${{ inputs.project != 'prim' && '--all-features' || '' }} --workspace --fail-under-lines ${{ inputs.project == 'esdk' && '80' || '80' }} --verbose

      # FIPS parity check for `prim`. `--no-default-features` is required to get
      # a FIPS-only build: `--features fips` alone leaves `default` enabled, so
      # both `aws-lc-sys` and `aws-lc-fips-sys` get compiled and only the latter
      # is used. Test-only — the coverage gate above already covers these lines
      # against the default backend, so this step exists to prove the same code
      # passes when linked against AWS-LC-FIPS. Needs the Go step above.
      - name: Test FIPS-only backend
        if: inputs.project == 'prim'
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: cargo test --no-default-features --features fips --verbose
