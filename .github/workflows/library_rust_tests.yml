      #   * MPL_EXAMPLE_LOGICAL_KEY_STORE_NAME   — logical keystore name
      #   * MPL_EXAMPLE_KMS_KEY_ARN              — KMS Key ARN
      #   * MPL_EXAMPLE_BRANCH_KEY_ID            — pre-existing branch
      #                                            key id in that table
