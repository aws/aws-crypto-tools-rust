      # - name: Configure AWS credentials (integ tests)
      #   if: inputs.project == 'mpl'
      #   uses: aws-actions/configure-aws-credentials@v5
      #   with:
      #     role-to-assume: arn:aws:iam::370957321024:role/<TODO-INTEG-TEST-ROLE>
      #     aws-region: us-west-2
      #
      # - name: Integ tests — keystore read path (real AWS)
      #   if: inputs.project == 'mpl'
      #   run: cargo test --features keystore --test test_keystore_branch_key_store_integ -- --ignored

      # TODO(examples-creds): Wire up AWS credentials before uncommenting
      # the steps below.
      #
      # The `aws_kms_hierarchical` example
      # (mpl/examples/aws_kms_hierarchical/) builds without AWS access
