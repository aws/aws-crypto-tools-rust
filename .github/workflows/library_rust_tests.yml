# Reusable workflow: build and test each project in `projects`, a JSON array of directories (e.g. ["mpl","esdk"]).
name: Library Rust Tests

on:
  workflow_call:
    inputs:
      projects:
        description: "JSON array of project subdirectories to build and test (e.g. [\"mpl\",\"esdk\"])."
        required: true
        type: string
      platforms:
        description: "JSON array of {os, runner} objects to run on."
        type: string
        default: >-
          [{"os": "ubuntu", "runner": "codebuild-CryptoToolsCI-linux-aws-crypto-tools-rust-${{ github.run_id }}-${{ github.run_attempt }}"},
           {"os": "macos", "runner": "macos-latest"},
           {"os": "windows", "runner": "windows-latest"}]
      toolchain:
        description: "Rust toolchain to build and test with. \"msrv\" reads rust-version from Cargo.toml."
        type: string
        default: stable
      lint:
        description: "Run fmt, clippy and rustdoc. Turn off for non-stable Rust, because lints change between versions."
        type: boolean
        default: true

jobs:
  testRust:
    name: ${{ matrix.project }} (${{ matrix.platform.os }})
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Support longpaths on Git checkout
        run: git config --global core.longpaths true
        working-directory: .

      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      # aws-lc-sys / aws-lc-fips-sys build AWS-LC with NASM (Netwide Assembler) on Windows.
      # NASM is not on the Windows runner PATH by default but Unix runners already provide an assembler.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install CMake
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
        working-directory: .

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy, rustfmt
          workspaces: ${{ matrix.project }}

      - name: Install cargo-hack
        if: inputs.lint
        uses: taiki-e/install-action@cargo-hack

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2
          role-session-name: RustTests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - name: Format check
        if: inputs.lint
        run: cargo fmt --all -- --check

      # Match the coverage step's features so clippy lints feature-gated tests.
      - name: Clippy
        if: inputs.lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy every feature combination
        if: inputs.lint
        run: >-
          cargo hack clippy --lib --feature-powerset --no-dev-deps
          --exclude-features default
          --mutually-exclusive-features aws-lc-sys,fips
          --at-least-one-of aws-lc-sys,fips
          -- -D warnings

      - name: Clippy with default features plus fips
        if: inputs.lint
        run: cargo clippy --lib --features fips -- -D warnings

      # Broken intra-doc links and other rustdoc warnings fail the build.
      # Docs don't vary by OS, so only Linux builds them.
      - name: Docs
        if: inputs.lint && runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Build
        run: cargo build --verbose

      - name: Run examples
        if: matrix.project == 'esdk'
        run: make examples

      - name: Test (all features)
        env:
          # Drop debug info to save RAM
          RUSTFLAGS: "-C debuginfo=0"
        # --all-features enables FIPS, which links aws-lc-fips-sys
        run: cargo test --all-features --workspace --verbose

      # Test without --all-features to test non-FIPS aws-lc-sys
      - name: Test (default features)
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: cargo test --workspace --verbose
