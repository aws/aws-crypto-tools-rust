# Reusable workflow that builds and tests a single project (subdirectory) in
# the monorepo. Callers pass the project directory name via the `project`
# input (e.g. "mpl"). All cargo commands run scoped to that subdirectory.
name: Library Rust Tests

on:
  workflow_call:
    inputs:
      project:
        description: "Project subdirectory to build and test (e.g. mpl, esdk)."
        required: true
        type: string

jobs:
  testRust:
    name: ${{ inputs.project }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - name: Support longpaths on Git checkout
        run: git config --global core.longpaths true
        working-directory: .

      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      # Required by aws-lc-fips-sys: its CMake build invokes Go to generate
      # FIPS module artifacts. GitHub-hosted runners do not put `go` on PATH
      # for this workflow by default.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # KMS-backed integration tests (e.g. tests/test_encrypt_decrypt.rs) call
      # kms:GenerateDataKey / kms:Decrypt against the shared AWS Crypto Tools
      # test keys in us-west-2, so CI must have AWS credentials. Assume the
      # shared public ESDK CI role via GitHub OIDC (the job already requests
      # `id-token: write`). This is the same role and pattern the existing
      # aws/aws-encryption-sdk `library_rust_tests.yml` uses. The role ARN is
      # public (no repo secret needed); access is gated by the role's OIDC
      # trust policy, which must permit `repo:aws/aws-crypto-tools-rust:*`.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2
          role-session-name: RustTests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.project }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # `--all-features` ensures feature-gated targets (e.g. the
        # `aws_kms_hierarchical` example, gated on `keystore`) are
        # type-checked under all supported feature combinations.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Build examples
        # Examples with `required-features` are skipped by `cargo build`
        # without the matching feature flags. Build them explicitly so
        # CI catches breakage between the library and any example bin.
        run: cargo build --all-features --examples --verbose

      # Coverage gate is 100% by default. `prim` runs at 95% because its
      # thin wrappers over aws-lc-rs contain defensive `.map_err(...)`
      # closures on crypto calls that don't fail in practice (RNG failure,
      # AEAD seal overflow, HKDF-Expand output-length rejection). Hitting
      # 100% there would require mocking aws-lc-rs.
      #
      # `esdk` runs at 80% temporarily (esdk is ~81% today); raise it
      # toward 100 as coverage fills in.
      #
      # Line coverage does not need debug info, so build the coverage binaries
      # with `-C debuginfo=0`. They are large (aws-lc-sys + aws-lc-fips-sys,
      # coverage-instrumented); dropping debug info keeps the ubuntu link within
      # the hosted runner's memory. Harmless on macOS.
      - name: Test + line coverage gate
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: cargo llvm-cov --all-features --workspace --fail-under-lines ${{ inputs.project == 'prim' && '95' || (inputs.project == 'esdk' && '80' || '100') }} --verbose

      # TODO(integ-tests-creds): Wire up AWS credentials before uncommenting
      # the steps below.
      #
      # The keystore integ tests in
      #   mpl/tests/test_keystore_branch_key_store_integ.rs
      # are #[ignore]'d by default and exercise the BranchKeyStore read
      # path against real AWS. They need read access to:
      #   * DynamoDB table `KeyStoreDdbTable` in account 370957321024
      #     (us-west-2)
      #   * KMS keys in account 370957321024 (us-west-2) and account
      #     658956600833 (us-east-1, us-west-2, ap-south-2)
      #
      # Recommended approach: OIDC role assumption via
      # aws-actions/configure-aws-credentials@v5. `id-token: write` is
      # already granted on the caller workflow (.github/workflows/pull.yml)
      # and on the `testRust` job above.
      #
      # When uncommenting, also extend the matrix or add a separate
      # `if:` if more than mpl ends up needing real-AWS integ tests.
