# Reusable workflow that builds and tests a single project (subdirectory) in
# the monorepo. Callers pass the project directory name via the `project`
# input (e.g. "mpl"). All cargo commands run scoped to that subdirectory.
name: Library Rust Tests

on:
  workflow_call:
    inputs:
      project:
        description: "Project subdirectory to build and test (e.g. mpl, esdk)."
        required: true
        type: string

jobs:
  testRust:
    name: ${{ inputs.project }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - name: Support longpaths on Git checkout
        run: git config --global core.longpaths true
        working-directory: .

      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      # Required by aws-lc-fips-sys: its CMake build invokes Go to generate
      # FIPS module artifacts. GitHub-hosted runners do not put `go` on PATH
      # for this workflow by default.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # The coverage step links large FIPS + coverage-instrumented test
      # binaries. On the GitHub-hosted ubuntu runner the default GNU `ld` runs
      # out of memory and dies with "ld terminated with signal 7 [Bus error],
      # core dumped". mold links the same binaries with far less peak memory,
      # so make it the default linker on Linux. macOS links fine with its
      # native linker, so this is Linux-only.
      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      # KMS-backed integration tests (e.g. tests/test_encrypt_decrypt.rs) call
      # kms:GenerateDataKey / kms:Decrypt against the shared AWS Crypto Tools
      # test keys in us-west-2, so CI must have AWS credentials. Assume the
      # shared public ESDK CI role via GitHub OIDC (the job already requests
      # `id-token: write`). This is the same role and pattern the existing
      # aws/aws-encryption-sdk `library_rust_tests.yml` uses. The role ARN is
      # public (no repo secret needed); access is gated by the role's OIDC
      # trust policy, which must permit `repo:aws/aws-crypto-tools-rust:*`.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2
          role-session-name: RustTests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.project }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test + line coverage gate (100%)
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 100 --verbose
