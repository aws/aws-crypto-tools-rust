# Reusable workflow that runs fmt, clippy, build, and unit tests for TestServer
# crates (the language servers this repo contributes to the cross-language
# TestServer). Callers pass a JSON array of {name, server, prebuild, os}
# objects via the `builds` input: `server` is the crate directory, `prebuild`
# a crate to `cargo build` first for a server that links its build output (or
# ""), and `os` the runner.
name: TestServer Build

on:
  workflow_call:
    inputs:
      builds:
        description: "JSON array of {name, server, prebuild, os} objects."
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.builds) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.server }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-workspaces: |
            ${{ matrix.server }}
            ${{ matrix.prebuild }}

      # A separate step keeps the two heavy Rust builds from running at once.
      - name: Build ${{ matrix.prebuild }}
        if: matrix.prebuild != ''
        working-directory: ${{ matrix.prebuild }}
        run: cargo build

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
