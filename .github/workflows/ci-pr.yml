# Runs CI on every pull request, limited to the jobs the change affects (see
# ci.yml).
name: PR CI

on:
  pull_request:

# Cancel the previous run when new commits are pushed to the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      scope: changed
    secrets: inherit

  # The single required status check for the main branch ruleset. It passes
  # when every CI job succeeded or was skipped as unaffected by the change.
  pr-ci-all-required:
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
