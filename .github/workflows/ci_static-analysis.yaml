# This workflow performs static analysis checks.
name: static analysis

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  not-grep:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: not-grep
        uses: mattsb42-meta/not-grep@584c5c7cf0e1a37346b4cc10bec163f5094f0537 # 1.0.1
