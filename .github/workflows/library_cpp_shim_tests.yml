# Reusable workflow: build and test the aws-esdk-cpp C++ shim.
name: Library C++ Shim Tests

on:
  workflow_call:
    inputs:
      platforms:
        description: "JSON array of {os, runner} objects to run on."
        type: string
        default: >-
          [{"os": "ubuntu", "runner": "codebuild-CryptoToolsCI-linux-aws-crypto-tools-rust-${{ github.run_id }}-${{ github.run_attempt }}"},
           {"os": "macos", "runner": "macos-latest"}]

jobs:
  shim:
    name: build + test (${{ matrix.platform.os }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      id-token: write
    env:
      ESDK_TEST_KMS_KEY_ARN: arn:aws:kms:us-west-2:370957321024:key/9d989aa2-2f9c-438c-a745-cc57d3ad0126
      ESDK_TEST_DDB_TABLE: KeyStoreDdbTable
      ESDK_TEST_LOGICAL_KEYSTORE: KeyStoreDdbTable
      ESDK_TEST_BRANCH_KEY_ID: 3ce7656b-e166-40f3-8c9b-a920ce6596cd
      ESDK_TEST_REGION: us-west-2
    defaults:
      run:
        working-directory: esdk/shims/aws-esdk-cpp
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt, llvm-tools-preview
          workspaces: esdk/shims/aws-esdk-cpp
          free-disk-space: "true"

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov

      # integration tests need real KMS + DynamoDB
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test (Rust unit + integration tests)
        if: runner.os != 'Linux'
        run: make test-ci-rust

      # On Linux the same tests run instrumented, so the test server dashboard
      # can merge this report with the test server's coverage of the shim.
      # Paths are made relative to the repository. `-C debuginfo=0` keeps the
      # instrumented link within the runner's memory.
      - name: Test (Rust unit + integration tests) + line coverage report
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: |
          cargo llvm-cov --lcov --output-path "$RUNNER_TEMP/lcov.info"
          mkdir -p "$RUNNER_TEMP/local-coverage"
          awk -v root="$GITHUB_WORKSPACE/" '
            /^SF:/ { keep = index($0, "SF:" root) == 1; if (keep) $0 = "SF:" substr($0, length(root) + 4) }
            keep' "$RUNNER_TEMP/lcov.info" > "$RUNNER_TEMP/local-coverage/cpp-shim.lcov"

      - name: Upload the line coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: local-coverage-cpp-shim
          path: ${{ runner.temp }}/local-coverage/cpp-shim.lcov
          if-no-files-found: error

      - name: Build and run C++ facade, example, and integration and local-correctness tests
        if: runner.os == 'Linux'
        run: make test-ci-cpp
