# Reusable workflow: build and test the aws-esdk-cpp C++ shim.
name: Library C++ Shim Tests

on:
  workflow_call:
    inputs:
      platforms:
        description: "JSON array of {os, runner} objects to run on."
        type: string
        default: >-
          [{"os": "ubuntu", "runner": "codebuild-CryptoToolsCI-linux-aws-crypto-tools-rust-${{ github.run_id }}-${{ github.run_attempt }}"},
           {"os": "macos", "runner": "macos-latest"}]

jobs:
  shim:
    name: build + test (${{ matrix.platform.os }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      id-token: write
    env:
      ESDK_TEST_KMS_KEY_ARN: arn:aws:kms:us-west-2:370957321024:key/9d989aa2-2f9c-438c-a745-cc57d3ad0126
      ESDK_TEST_DDB_TABLE: KeyStoreDdbTable
      ESDK_TEST_LOGICAL_KEYSTORE: KeyStoreDdbTable
      ESDK_TEST_BRANCH_KEY_ID: 3ce7656b-e166-40f3-8c9b-a920ce6596cd
      ESDK_TEST_REGION: us-west-2
    defaults:
      run:
        working-directory: esdk/shims/aws-esdk-cpp
    steps:
      - uses: actions/checkout@v6

      # aws-lc-fips-sys builds AWS-LC's FIPS module with CMake.
      - name: Install CMake
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
        working-directory: .

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          workspaces: esdk/shims/aws-esdk-cpp
          free-disk-space: "true"

      # integration tests need real KMS + DynamoDB
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy with FIPS
        run: cargo clippy --all-targets --features fips -- -D warnings

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Clippy every feature combination
        run: >-
          cargo hack clippy --lib --feature-powerset --no-dev-deps
          --exclude-features default
          --mutually-exclusive-features aws-lc-sys,fips
          --at-least-one-of aws-lc-sys,fips
          --group-features kms,ddb,default-aws-sdk-clients
          -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test (Rust unit + integration tests)
        run: make test-ci-rust

      - name: Build and run C++ facade, example, and integration and local-correctness tests
        if: runner.os == 'Linux'
        run: make test-ci-cpp

      - name: Build and run the raw AES example with only the raw AES keyring
        run: |
          cargo build --no-default-features --features aws-lc-sys
          make raw_aes_example
          ./raw_aes_keyring_example
