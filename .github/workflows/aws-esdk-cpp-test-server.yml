name: ESDK TestServer (C++ shim)

on:
  pull_request:
    paths:
      - "esdk-cpp-test-server/**"
      - "esdk/**"
      - ".github/workflows/aws-esdk-cpp-test-server.yml"
  push:
    branches:
      - main
    paths:
      - "esdk-cpp-test-server/**"
      - "esdk/**"
      - ".github/workflows/aws-esdk-cpp-test-server.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cpp-shim-language-server:
    name: "C++ shim server: fmt, clippy, unit tests"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: esdk-cpp-test-server
    steps:
      - uses: actions/checkout@v4

      # aws-lc-sys (via aws-esdk) needs Go to build its native code
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            esdk-cpp-test-server
            esdk/shims/aws-esdk-cpp

      # The server links the shim's cdylib, so build the shim first (a separate
      # step keeps the two heavy Rust builds from running at once).
      - name: Build the aws-esdk-cpp shim
        run: cd ../esdk/shims/aws-esdk-cpp && cargo build

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      # The live hierarchical round trip SKIPs without ESDK_TEST_* credentials.
      - name: Test
        run: cargo test --verbose

  # The complete cross-language TestServer run: `make test-server` clones commons and
  # the orchestrator materializes + builds + launches every configured Language_Server
  # (this working tree is the live server), runs the full pairwise matrix, and tears
  # down. Provisions the full toolchain matrix + the commons build caches. Needs the
  # COMMONS_REPO_PAT secret (read on commons + java + rust).
  # The cross-language TestServer run, from the shared commons workflow. This
  # checkout supplies the rust-cpp server; every other server comes from its
  # configured branch. Only the pairs involving rust-cpp run; the full matrix runs in commons.
  test-server:
    name: TestServer
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: aws/aws-crypto-tools-commons/.github/workflows/esdk-test-server-reusable.yml@lucmcdon/test-server-fast-launch
    with:
      focus: rust-cpp
      checkout-languages: rust-cpp
      commons-ref: lucmcdon/test-server-fast-launch
      # TEMPORARY: save from this PR to verify warm runs.
      save-caches: true
    secrets:
      repo-pat: ${{ secrets.COMMONS_REPO_PAT }}
