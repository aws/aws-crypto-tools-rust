# Runs the ESDK Rust benchmark for each keyring and publishes results to
# CloudWatch Logs.
name: Performance Benchmarks

permissions:
  id-token: write
  contents: read

on:
  # ci.yml calls this on PRs, pushes to main, and the daily run.
  workflow_call:
  workflow_dispatch:

jobs:
  benchmark:
    # Skip the scheduled run on forks.
    if: github.event_name != 'schedule' || github.repository_owner == 'aws'
    name: ${{ matrix.keyring }}
    strategy:
      fail-fast: false
      matrix:
        keyring: [hierarchical, raw-aes]
    runs-on: codebuild-CryptoToolsCI-linux-aws-crypto-tools-rust-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: esdk/performance-tests
    steps:
      - name: Support longpaths on Git checkout
        run: git config --global core.longpaths true
        working-directory: .

      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          workspaces: esdk/performance-tests
          lockfile: check

      # The hierarchical keyring reads the shared test key store (KMS + DynamoDB,
      # account 370957321024, us-west-2) and every leg uploads to CloudWatch
      # Logs; same OIDC role as library_rust_tests.yml.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2
          role-session-name: RustPerformanceBenchmarks
          special-characters-workaround: "true" # Some environments cannot tolerate special characters in a secret key.

      - name: Run performance benchmarks - Quick Mode
        run: cargo run --release -- --quick --keyring ${{ matrix.keyring }}

      - name: Parse and Format Logs
        working-directory: esdk/performance-tests/results/raw-data
        run: |
          LOG_FILE="rust_results.json"
          UPLOAD_FILE="cloudwatch_logs.json"
          jq -c --arg ts "$(date +%s)000" '[.results[] as $result | .metadata as $meta | {timestamp: ($ts | tonumber), message: ({metadata: $meta, result: $result} | tostring)}]' "$LOG_FILE" > "$UPLOAD_FILE"

      # PRs only check that the benchmark runs. Only the daily run publishes,
      # so PR numbers don't mix into the tracked series.
      - name: Upload logs to CloudWatch
        if: github.event_name == 'schedule'
        working-directory: esdk/performance-tests/results/raw-data
        run: |
          LOG_FILE="cloudwatch_logs.json"
          LOG_GROUP="aws-esdk-performance-benchmarks"
          # Distinct stream per keyring so series don't mix in the shared log group.
          # "ubuntu-latest" and the workflow name are fixed, so the stream name from
          # before the move into ci.yml and onto CodeBuild stays the same.
          LOG_STREAM="rust-${{ matrix.keyring }}/ubuntu-latest/quick_benchmarks/Performance Benchmarks"

          aws logs create-log-stream \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_STREAM" 2>/dev/null || true

          aws logs put-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_STREAM" \
            --log-events file://"$LOG_FILE"
