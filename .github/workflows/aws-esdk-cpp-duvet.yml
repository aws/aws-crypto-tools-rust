# Runs duvet for the aws-esdk-cpp shim and uploads its HTML compliance report.
# Reuses the shared duvet.yml reusable workflow, targeting the shim's nested
# project directory and giving the artifact a slash-free name.
name: aws-esdk-cpp duvet

on:
  pull_request:
    paths:
      - "esdk/shims/aws-esdk-cpp/**"
      - ".github/workflows/aws-esdk-cpp-duvet.yml"
      - ".github/workflows/duvet.yml"
      - "spec"
      - ".gitmodules"
  push:
    paths:
      - "esdk/shims/aws-esdk-cpp/**"
      - ".github/workflows/aws-esdk-cpp-duvet.yml"
      - ".github/workflows/duvet.yml"
      - "spec"
      - ".gitmodules"
  workflow_dispatch:

jobs:
  duvet:
    uses: ./.github/workflows/duvet.yml
    with:
      project: esdk/shims/aws-esdk-cpp
      artifact-name: aws-esdk-cpp-duvet-report
