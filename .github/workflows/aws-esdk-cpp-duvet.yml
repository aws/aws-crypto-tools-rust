# Duvet for the aws-esdk-cpp shim via the reusable duvet.yml. artifact-name is
# set because the nested project path contains slashes, which artifact names
# do not allow.
name: aws-esdk-cpp duvet

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "esdk/shims/aws-esdk-cpp/**"
      - ".github/workflows/aws-esdk-cpp-duvet.yml"
      - ".github/workflows/duvet.yml"
      - "spec"
      - ".gitmodules"
  push:
    paths:
      - "esdk/shims/aws-esdk-cpp/**"
      - ".github/workflows/aws-esdk-cpp-duvet.yml"
      - ".github/workflows/duvet.yml"
      - "spec"
      - ".gitmodules"
  workflow_dispatch:

jobs:
  duvet:
    uses: ./.github/workflows/duvet.yml
    with:
      project: esdk/shims/aws-esdk-cpp
      artifact-name: aws-esdk-cpp-duvet-report
