name: aws-esdk-cpp duvet

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "esdk/shims/aws-esdk-cpp/**"
      - "!esdk/shims/aws-esdk-cpp/test-server/**"
      - ".github/workflows/aws-esdk-cpp-duvet.yml"
      - ".github/workflows/duvet.yml"
      - "spec"
      - ".gitmodules"
  push:
    paths:
      - "esdk/shims/aws-esdk-cpp/**"
      - "!esdk/shims/aws-esdk-cpp/test-server/**"
      - ".github/workflows/aws-esdk-cpp-duvet.yml"
      - ".github/workflows/duvet.yml"
      - "spec"
      - ".gitmodules"
  workflow_dispatch:

jobs:
  duvet:
    uses: ./.github/workflows/duvet.yml
    with:
      project: esdk/shims/aws-esdk-cpp
      artifact-name: aws-esdk-cpp-duvet-report
