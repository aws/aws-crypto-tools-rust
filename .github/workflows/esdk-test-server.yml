# ============================================================================
# ESDK TestServer — Rust Language_Server CI
# ----------------------------------------------------------------------------
# Builds and tests the Rust Language_Server against this repo's live aws-esdk
# source (the "TestServer(live source code)" direction of the factoring design).
# It is intentionally scoped to esdk-test-server/** and this file, and is a
# SEPARATE workflow from the library CI (pull.yml) so it neither depends on nor
# is blocked by the coverage-gated library jobs.
#
# The offline Raw-AES path currently stops at the keyring wall (the Rust ESDK
# does not implement keyring construction yet); tests/keyring_wall.rs asserts the
# server surfaces that as an ESDKClientError, so this workflow is GREEN on the
# wall. The hierarchical-interop job runs the commons HierarchicalBlobRoundTripTest
# across a launched Rust + Java server pair in both directions; it needs the
# CI_AWS_ROLE_ARN and COMMONS_REPO_TOKEN repo secrets and is red until they are set.
# ============================================================================
name: ESDK TestServer (Rust)

on:
  pull_request:
    paths:
      - "esdk-test-server/**"
      - ".github/workflows/esdk-test-server.yml"
  push:
    paths:
      - "esdk-test-server/**"
      - ".github/workflows/esdk-test-server.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-language-server:
    name: build + test (live aws-esdk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esdk-test-server
    steps:
      - uses: actions/checkout@v4

      # aws-lc-sys (pulled in transitively by aws-esdk) builds native code; Go is
      # required by the aws-lc build tooling on hosted runners, matching the
      # library CI setup.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: esdk-test-server

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test (rpcv2Cbor wire round trip + keyring wall)
        run: cargo test --verbose

  # ------------------------------------------------------------------------
  # Cross-repo end-to-end: pull the commons TestServer at its integration branch,
  # build the one Java Test_Client + Tests, start THIS repo's Rust server, and run
  # the Tests against it. Manual-only for now: the offline Raw-AES round trip
  # cannot pass until the Rust ESDK implements keyring construction. When it does,
  # remove the workflow_dispatch gate to make this a PR gate.
  # ------------------------------------------------------------------------
  hierarchical-interop:
    name: Rust<->Java hierarchical keyring interop
    runs-on: ubuntu-latest
    # Requires two repo secrets:
    #   CI_AWS_ROLE_ARN     — OIDC role in the branch-key-store account
    #                         (370957321024) with KMS decrypt/generate on the
    #                         fixture key and DynamoDB read on KeyStoreDdbTable.
    #   COMMONS_REPO_TOKEN  — read access to aws/aws-crypto-tools-commons.
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-west-2
      ESDK_TESTSERVER_AWS_INTEGRATION: "true"
    steps:
      - name: Checkout Rust repo
        uses: actions/checkout@v4
        with:
          path: rust

      - name: Checkout commons TestServer (integration branch)
        uses: actions/checkout@v4
        with:
          repository: aws/aws-crypto-tools-commons
          ref: kessplas/esdk-test-server
          path: commons
          token: ${{ secrets.COMMONS_REPO_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure AWS credentials (branch-key-store account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Build the Rust language server
        working-directory: rust/esdk-test-server
        run: cargo build --release

      - name: Bidirectional hierarchical round trip (Rust <-> Java)
        run: |
          set -euo pipefail
          RUST_BIN="$GITHUB_WORKSPACE/rust/esdk-test-server/target/release/esdk-test-server"
          JAVA_DIR="$GITHUB_WORKSPACE/commons/esdk/test-server/servers/java"
          TESTS_DIR="$GITHUB_WORKSPACE/commons/esdk/test-server/tests"

          # Both servers inherit the AWS credentials configured above; each builds
          # a hierarchical keyring over the shared KeyStoreDdbTable branch key.
          "$RUST_BIN" 8092 >"$GITHUB_WORKSPACE/rust-server.log" 2>&1 &
          RUST_PID=$!
          ( cd "$JAVA_DIR" && exec ./gradlew --console=plain -q runServer --args="8091" ) \
            >"$GITHUB_WORKSPACE/java-server.log" 2>&1 &
          JAVA_PID=$!

          cleanup() {
            trap - EXIT INT TERM
            kill "$RUST_PID" "$JAVA_PID" 2>/dev/null || true
            for p in 8091 8092; do
              pids=$(lsof -ti "tcp:$p" 2>/dev/null || true)
              if [ -n "$pids" ]; then kill $pids 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT INT TERM

          wait_for() {
            for _ in $(seq 1 300); do
              if nc -z 127.0.0.1 "$1" 2>/dev/null; then echo "port $1 up"; return 0; fi
              if ! kill -0 "$2" 2>/dev/null && ! lsof -ti "tcp:$1" >/dev/null 2>&1; then
                echo "server for port $1 exited early"; return 1
              fi
              sleep 1
            done
            echo "timed out waiting for port $1"; return 1
          }
          wait_for 8092 "$RUST_PID"
          wait_for 8091 "$JAVA_PID"

          cd "$TESTS_DIR"
          echo "==> Rust encrypt -> Java decrypt"
          ./gradlew --console=plain --rerun-tasks test --tests '*HierarchicalBlobRoundTripTest' \
            -Desdk.testserver.endpoints=http://127.0.0.1:8092,http://127.0.0.1:8091
          echo "==> Java encrypt -> Rust decrypt"
          ./gradlew --console=plain --rerun-tasks test --tests '*HierarchicalBlobRoundTripTest' \
            -Desdk.testserver.endpoints=http://127.0.0.1:8091,http://127.0.0.1:8092

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-server-logs
          path: |
            rust-server.log
            java-server.log
          if-no-files-found: ignore
