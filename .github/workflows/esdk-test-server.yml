# Separate from the library CI (pull.yml) so this crate is not swept into the
# coverage-gated library jobs.
name: ESDK TestServer (Rust)

on:
  pull_request:
    paths:
      - "esdk-test-server/**"
      - "esdk/**"
      - ".github/workflows/esdk-test-server.yml"
  push:
    paths:
      - "esdk-test-server/**"
      - "esdk/**"
      - ".github/workflows/esdk-test-server.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-language-server:
    name: build + test (live aws-esdk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esdk-test-server
    steps:
      - uses: actions/checkout@v4

      # aws-lc-sys (via aws-esdk) needs Go to build its native code
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: esdk-test-server

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  # The complete cross-language TestServer run, delegated to the commons
  # orchestrator: `make test-server` clones commons and the core builds and
  # launches every configured Language_Server (this working tree is the live
  # Rust source), runs the full Tests matrix, and tears down. Runs on every
  # pull_request/push; needs the CI_AWS_ROLE_ARN and COMMONS_REPO_TOKEN repo
  # secrets.
  test-server:
    name: Cross-language TestServer run
    runs-on: ubuntu-latest
    # Requires two repo secrets:
    #   CI_AWS_ROLE_ARN     — OIDC role in the branch-key-store account
    #                         (370957321024) with KMS decrypt/generate on the
    #                         fixture key and DynamoDB read on KeyStoreDdbTable.
    #   COMMONS_REPO_TOKEN  — read access to aws/aws-crypto-tools-commons.
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-west-2
    steps:
      - uses: actions/checkout@v4

      # aws-lc-sys (via aws-esdk) needs Go to build its native code
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The commons orchestrator (smithy-java) needs a JDK 21+
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure AWS credentials (branch-key-store account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ESDK_TEST_SERVER_KMS_ROLE_ARN || 'arn:aws:iam::370957321024:role/esdk-test-server-ci-kms-role' }}
          aws-region: us-west-2

      # The bootstrap's plain `git clone` of the private commons repo picks up
      # this SSH -> HTTPS+token mapping.
      - name: Authenticate the commons clone
        run: git config --global url."https://x-access-token:${{ secrets.COMMONS_REPO_PAT }}@github.com/".insteadOf "git@github.com:"

      - name: Run the orchestrated TestServer
        working-directory: esdk-test-server
        run: make test-server
