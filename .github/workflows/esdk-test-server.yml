# Separate from the library CI (pull.yml) so this crate is not swept into the
# coverage-gated library jobs.
name: ESDK TestServer (Rust)

on:
  pull_request:
    paths:
      - "esdk-test-server/**"
      - ".github/workflows/esdk-test-server.yml"
  push:
    paths:
      - "esdk-test-server/**"
      - ".github/workflows/esdk-test-server.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-language-server:
    name: build + test (live aws-esdk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esdk-test-server
    steps:
      - uses: actions/checkout@v4

      # aws-lc-sys (via aws-esdk) needs Go to build its native code
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: esdk-test-server

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  # Cross-repo end-to-end: build the commons Java Test_Client + Tests, start this
  # repo's Rust server and the commons Java server, and run the hierarchical
  # round trip in both directions.
  hierarchical-interop:
    name: Rust<->Java hierarchical keyring interop
    # Manual-only until the two repo secrets below exist; skips (not fails) on
    # pull_request/push. Remove the guard to make this a PR gate.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Requires two repo secrets:
    #   CI_AWS_ROLE_ARN     — OIDC role in the branch-key-store account
    #                         (370957321024) with KMS decrypt/generate on the
    #                         fixture key and DynamoDB read on KeyStoreDdbTable.
    #   COMMONS_REPO_TOKEN  — read access to aws/aws-crypto-tools-commons.
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-west-2
      ESDK_TESTSERVER_AWS_INTEGRATION: "true"
    steps:
      - name: Checkout Rust repo
        uses: actions/checkout@v4
        with:
          path: rust

      - name: Checkout commons TestServer (integration branch)
        uses: actions/checkout@v4
        with:
          repository: aws/aws-crypto-tools-commons
          ref: kessplas/esdk-test-server
          path: commons
          token: ${{ secrets.COMMONS_REPO_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure AWS credentials (branch-key-store account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Build the Rust language server
        working-directory: rust/esdk-test-server
        run: cargo build --release

      - name: Bidirectional hierarchical round trip (Rust <-> Java)
        run: |
          set -euo pipefail
          RUST_BIN="$GITHUB_WORKSPACE/rust/esdk-test-server/target/release/esdk-test-server"
          JAVA_DIR="$GITHUB_WORKSPACE/commons/esdk/test-server/servers/java"
          TESTS_DIR="$GITHUB_WORKSPACE/commons/esdk/test-server/tests"

          # Both servers inherit the job's AWS credentials for the shared key store.
          "$RUST_BIN" 8092 >"$GITHUB_WORKSPACE/rust-server.log" 2>&1 &
          RUST_PID=$!
          ( cd "$JAVA_DIR" && exec ./gradlew --console=plain -q runServer --args="8091" ) \
            >"$GITHUB_WORKSPACE/java-server.log" 2>&1 &
          JAVA_PID=$!

          cleanup() {
            trap - EXIT INT TERM
            kill "$RUST_PID" "$JAVA_PID" 2>/dev/null || true
            for p in 8091 8092; do
              pids=$(lsof -ti "tcp:$p" 2>/dev/null || true)
              if [ -n "$pids" ]; then kill $pids 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT INT TERM

          wait_for() {
            for _ in $(seq 1 300); do
              if nc -z 127.0.0.1 "$1" 2>/dev/null; then echo "port $1 up"; return 0; fi
              if ! kill -0 "$2" 2>/dev/null && ! lsof -ti "tcp:$1" >/dev/null 2>&1; then
                echo "server for port $1 exited early"; return 1
              fi
              sleep 1
            done
            echo "timed out waiting for port $1"; return 1
          }
          wait_for 8092 "$RUST_PID"
          wait_for 8091 "$JAVA_PID"

          cd "$TESTS_DIR"
          echo "==> Rust encrypt -> Java decrypt"
          ./gradlew --console=plain --rerun-tasks test --tests '*HierarchicalBlobRoundTripTest' \
            -Desdk.testserver.endpoints=http://127.0.0.1:8092,http://127.0.0.1:8091
          echo "==> Java encrypt -> Rust decrypt"
          ./gradlew --console=plain --rerun-tasks test --tests '*HierarchicalBlobRoundTripTest' \
            -Desdk.testserver.endpoints=http://127.0.0.1:8091,http://127.0.0.1:8092

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-server-logs
          path: |
            rust-server.log
            java-server.log
          if-no-files-found: ignore
