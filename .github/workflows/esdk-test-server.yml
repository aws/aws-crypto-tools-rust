# Separate from the library CI (pull.yml) so this crate is not swept into the
# coverage-gated library jobs.
name: ESDK TestServer (Rust)

on:
  pull_request:
    paths:
      - "esdk/test-server/**"
      - "esdk/**"
      - "!esdk/shims/aws-esdk-cpp/test-server/**"
      - ".github/workflows/esdk-test-server.yml"
  push:
    branches:
      - main
    paths:
      - "esdk/test-server/**"
      - "esdk/**"
      - "!esdk/shims/aws-esdk-cpp/test-server/**"
      - ".github/workflows/esdk-test-server.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-language-server:
    name: "Rust server: fmt, clippy, unit tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esdk/test-server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # aws-lc-sys (via aws-esdk) needs Go to build its native code
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: esdk/test-server

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  # The cross-language TestServer run, from the shared commons workflow. This
  # checkout supplies the rust server; every other server comes from its
  # configured branch. Only the pairs involving rust run; the full matrix runs in commons.
  test-server:
    name: TestServer
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: aws/aws-crypto-tools-commons/.github/workflows/esdk-test-server-reusable.yml@lucmcdon/test-server-depends-on
    with:
      commons-ref: lucmcdon/test-server-depends-on
      focus: rust
      checkout-languages: rust
    secrets:
      repo-pat: ${{ secrets.COMMONS_REPO_PAT }}
