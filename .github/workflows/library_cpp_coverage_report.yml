# Reports C++ shims' total line coverage.
# Unlike the Rust coverage workflow, this doesn't pick up new shims automatically.
name: Library C++ Shim Coverage Report

on:
  pull_request:
  schedule:
    # 07:00 UTC every day
    - cron: '0 7 * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  coverageReport:
    name: cpp shim line coverage
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
          fetch-depth: 0

      # aws-lc-fips-sys needs Go to build
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # The C++ side must be compiled by the clang whose LLVM major matches
      # rustc's, so the profile runtime writes the profraw version that
      # rustc's llvm-profdata expects.
      - name: Install clang matching rustc's LLVM
        run: |
          set -euo pipefail
          llvm_major=$(rustc -vV | sed -n 's/^LLVM version: \([0-9][0-9]*\).*/\1/p')
          test -n "$llvm_major"
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$llvm_major"
          echo "CC=clang-$llvm_major" >> "$GITHUB_ENV"
          echo "CXX=clang++-$llvm_major" >> "$GITHUB_ENV"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2
          role-session-name: CppShimCoverageReport
          special-characters-workaround: "true"

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: esdk/shims/aws-esdk-cpp

      - name: Measure C++ shim line coverage
        working-directory: esdk/shims/aws-esdk-cpp
        env:
          # Drop debug info to save RAM
          RUSTFLAGS: "-C debuginfo=0"
          ESDK_TEST_KMS_KEY_ARN: arn:aws:kms:us-west-2:370957321024:key/9d989aa2-2f9c-438c-a745-cc57d3ad0126
          ESDK_TEST_DDB_TABLE: KeyStoreDdbTable
          ESDK_TEST_LOGICAL_KEYSTORE: KeyStoreDdbTable
          ESDK_TEST_BRANCH_KEY_ID: 3ce7656b-e166-40f3-8c9b-a920ce6596cd
          ESDK_TEST_REGION: us-west-2
        run: |
          set -euo pipefail
          make coverage-cpp COV_CPP_REPORT="report --summary-only --json --output-path coverage-summary.json"
          line_pct=$(jq -r '.data[0].totals.lines.percent' coverage-summary.json)
          line_cov=$(jq -r '.data[0].totals.lines.covered' coverage-summary.json)
          line_cnt=$(jq -r '.data[0].totals.lines.count' coverage-summary.json)
          printf '### aws-esdk-cpp (C++ shim)\nLine coverage: **%.2f%%** (%s / %s lines)\n' \
            "$line_pct" "$line_cov" "$line_cnt" >> "$GITHUB_STEP_SUMMARY"
