# This workflow builds TestVectors for all languages once per OS,
# uploading artifacts for downstream interop test jobs.
name: Dafny Library Interop Build

on:
  workflow_call:

jobs:
  buildInterop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    env:
      RUST_MIN_STACK: 404857600
    steps:
      - name: Support longpaths on Git checkout
        run: |
          git config --global core.longpaths true

      - name: Checkout Dafny MPL
        uses: actions/checkout@v4
        with:
            repository: aws/aws-cryptographic-material-providers-library
            path: dafny-mpl
            submodules: "recursive"

      # Resolve the upstream Dafny MPL commit SHA that was just checked out.
      # This becomes part of the cache key so any Dafny MPL change busts the
      # cache automatically.
      - name: Resolve Dafny MPL commit SHA
        id: dafny-sha
        working-directory: ./dafny-mpl
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Dafny MPL SHA: $SHA"

      # Try to restore the transpiled Dafny outputs from cache. Cache key
      # busts on any change to this workflow file (via hashFiles), on any
      # upstream Dafny MPL commit, or on OS change. On hit, all subsequent
      # build steps are skipped and the cached outputs are uploaded as
      # artifacts directly.
      - name: Restore Dafny interop build cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ./dafny-mpl/**/runtimes/java/src/main/dafny-generated/
            ./dafny-mpl/**/runtimes/java/src/test/dafny-generated/
            ./dafny-mpl/**/runtimes/rust/src/
            ./dafny-mpl/**/runtimes/rust/Cargo.lock
            ~/.m2/repository/software/amazon/
          key: dafny-interop-${{ matrix.os }}-${{ hashFiles('.github/workflows/dafny_library_interop_build.yml') }}-${{ steps.dafny-sha.outputs.sha }}

      - name: Setup Java 8
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 8

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 17

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Install Go imports
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.36.0

      # --- Dafny + codegen ---
      - name: Setup Dafny
        uses: ./dafny-mpl/.github/actions/setup_dafny
        with:
          dafny-version: "4.9.0"

      - name: Install Smithy-Dafny codegen dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: ./dafny-mpl/.github/actions/install_smithy_dafny_codegen_dependencies
        with:
          mpl-submodule-path: ./dafny-mpl/

      # --- Build non-Rust languages (use standard Dafny) ---
      - name: Build Java
        if: steps.cache-restore.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ./dafny-mpl/TestVectorsAwsCryptographicMaterialProviders
        run: |
          CORES=$(node -e 'console.log(os.cpus().length)')
          make build_java CORES=$CORES

      # --- Build Rust (uses Dafny 4.10.0) ---
      - name: Setup Dafny for Rust
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: ./dafny-mpl/.github/actions/setup_dafny
        with:
          dafny-version: "4.10.0"

      - name: Build Rust (polymorph + transpile)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ./dafny-mpl/TestVectorsAwsCryptographicMaterialProviders
        run: |
          CORES=$(node -e 'console.log(os.cpus().length)')
          make polymorph_rust
          make transpile_rust TRANSPILE_TESTS_IN_RUST=1 CORES=$CORES

      # Persist the freshly-built outputs to cache. Only runs on cache miss;
      # on hit the entry already exists under this key.
      - name: Save Dafny interop build cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ./dafny-mpl/**/runtimes/java/src/main/dafny-generated/
            ./dafny-mpl/**/runtimes/java/src/test/dafny-generated/
            ./dafny-mpl/**/runtimes/rust/src/
            ./dafny-mpl/**/runtimes/rust/Cargo.lock
            ~/.m2/repository/software/amazon/
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
