# This workflow builds TestVectors for all languages once per OS,
# uploading artifacts for downstream interop test jobs.
name: Dafny Library Interop Build

on:
  workflow_call:

jobs:
  buildInterop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    env:
      RUST_MIN_STACK: 404857600
    steps:
      - name: Support longpaths on Git checkout
        run: |
          git config --global core.longpaths true

      - name: Checkout Dafny MPL
        uses: actions/checkout@v4
        with:
            repository: aws/aws-cryptographic-material-providers-library
            path: dafny-mpl
            submodules: "recursive"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 17

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Install Go imports
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.36.0

      # --- Dafny + codegen ---
      - name: Setup Dafny
        uses: ./dafny-mpl/.github/actions/setup_dafny
        with:
          dafny-version: "4.9.0"

      - name: Install Smithy-Dafny codegen dependencies
        uses: ./dafny-mpl/.github/actions/install_smithy_dafny_codegen_dependencies
        with:
          mpl-submodule-path: ./dafny-mpl/

      # --- Build non-Rust languages (use standard Dafny) ---
      - name: Build Java
        shell: bash
        working-directory: ./dafny-mpl/TestVectorsAwsCryptographicMaterialProviders
        run: |
          CORES=$(node -e 'console.log(os.cpus().length)')
          make build_java CORES=$CORES

      # --- Build Rust (uses Dafny 4.10.0) ---
      - name: Setup Dafny for Rust
        uses: ./dafny-mpl/.github/actions/setup_dafny
        with:
          dafny-version: "4.10.0"

      - name: Build Rust (polymorph + transpile)
        shell: bash
        working-directory: ./dafny-mpl/TestVectorsAwsCryptographicMaterialProviders
        run: |
          CORES=$(node -e 'console.log(os.cpus().length)')
          make polymorph_rust
          make transpile_rust TRANSPILE_TESTS_IN_RUST=1 CORES=$CORES

      - run: echo "TIMESTAMP=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      # --- Upload artifacts per language ---
      - name: Upload Java transpiled source
        uses: actions/upload-artifact@v7
        with:
          name: interop-java-${{ env.TIMESTAMP }}-${{ matrix.os }}-${{ github.sha }}
          path: |
            **/runtimes/java/src/main/dafny-generated/
            **/runtimes/java/src/test/dafny-generated/
            !node_modules/**/
            !smithy-dafny/**/
          retention-days: 1

      - name: Upload Java Maven local
        uses: actions/upload-artifact@v7
        with:
          name: interop-java-maven-${{ env.TIMESTAMP }}-${{ matrix.os }}-${{ github.sha }}
          path: ~/.m2/repository/software/amazon/
          retention-days: 1

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v7
        with:
          name: interop-rust-${{ env.TIMESTAMP }}-${{ matrix.os }}-${{ github.sha }}
          path: |
            **/runtimes/rust/src/
            **/runtimes/rust/Cargo.lock
            !**/runtimes/rust/target/
            !node_modules/**/
            !smithy-dafny/**/
          retention-days: 1