# Reusable workflow that runs duvet for a single project (subdirectory) and
# uploads the HTML compliance report as a build artifact. Callers pass the
# project directory name via the `project` input (e.g. "esdk"). The project
# must have a `.duvet/config.toml` and a `make duvet` target.
name: Duvet Report

on:
  workflow_call:
    inputs:
      project:
        description: "Project subdirectory to run duvet in (e.g. esdk)."
        required: true
        type: string

jobs:
  duvet:
    name: duvet (${{ inputs.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # duvet is not prebuilt by taiki-e/install-action, so it is installed
      # from source. Resolve the latest published version and key the binary
      # cache on it: each run tracks the newest release, the cache key and the
      # installed binary always agree, and the source build only happens when
      # a new duvet version is published.
      - name: Resolve duvet version
        id: duvet-version
        run: |
          version=$(curl -sf --retry 3 -H "User-Agent: aws-crypto-tools-rust CI (duvet workflow)" \
            https://crates.io/api/v1/crates/duvet | jq -r '.crate.max_stable_version')
          test -n "$version" && test "$version" != "null"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "duvet $version"

      - name: Cache duvet binary
        id: cache-duvet
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/duvet
          key: duvet-bin-${{ runner.os }}-${{ steps.duvet-version.outputs.version }}

      - name: Install duvet
        if: steps.cache-duvet.outputs.cache-hit != 'true'
        run: cargo install duvet --version ${{ steps.duvet-version.outputs.version }} --locked

      - name: Run duvet
        run: make duvet

      - name: Upload duvet report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.project }}-duvet-report
          include-hidden-files: true
          path: ${{ inputs.project }}/.duvet/reports/report.html
