# Reusable workflow: run duvet for each project and upload its HTML compliance report.
# `projects` is a JSON array of {name, project, artifact}:
#   name      job name
#   project   directory, e.g. esdk/shims/aws-esdk-cpp; needs a .duvet/config.toml and a `make duvet` target
#   artifact  artifact name; GitHub rejects slashes, so it can't be the directory
name: Duvet Report

on:
  workflow_call:
    inputs:
      projects:
        description: "JSON array of {name, project, artifact} objects."
        required: true
        type: string

jobs:
  duvet:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.projects) }}
    runs-on: codebuild-CryptoToolsCI-linux-aws-crypto-tools-rust-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Install duvet at its latest published release, matching the duvet
      # workflow in aws-cryptographic-material-providers-library. duvet has no
      # prebuilt binary, so it builds from source.
      - name: Install duvet
        run: cargo +stable install duvet

      - name: Run duvet
        run: make duvet

      - name: Upload duvet report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          include-hidden-files: true
          path: ${{ matrix.project }}/.duvet/reports/report.html
