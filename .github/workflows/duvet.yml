# Reusable workflow that runs duvet for a single project (subdirectory) and
# uploads the HTML compliance report as a build artifact. Callers pass the
# project directory name via the `project` input (e.g. "esdk", or a nested path
# like "esdk/shims/aws-esdk-cpp"). The project must have a `.duvet/config.toml`
# and a `make duvet` target.
name: Duvet Report

on:
  workflow_call:
    inputs:
      project:
        description: "Project subdirectory to run duvet in (e.g. esdk)."
        required: true
        type: string
      artifact-name:
        description: >
          Name for the uploaded report artifact. Defaults to
          "<project>-duvet-report". Set this for nested project paths, whose
          slashes are not allowed in an artifact name.
        required: false
        type: string
        default: ""

jobs:
  duvet:
    name: duvet (${{ inputs.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v6

      # Install duvet at its latest published release, matching the duvet
      # workflow in aws-cryptographic-material-providers-library. duvet has no
      # prebuilt binary, so it builds from source; cargo/rustup are
      # preinstalled on the runner.
      - name: Install duvet
        run: cargo +stable install duvet

      - name: Run duvet
        run: make duvet

      - name: Upload duvet report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('{0}-duvet-report', inputs.project) }}
          include-hidden-files: true
          path: ${{ inputs.project }}/.duvet/reports/report.html
