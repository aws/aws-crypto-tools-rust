# Reusable workflow: run duvet for each project and upload its HTML compliance report.
# `projects` is a JSON array of {name, project, artifact}:
#   name      job name
#   project   directory, e.g. esdk/shims/aws-esdk-cpp; needs a .duvet/config.toml and a `make duvet` target
#   artifact  artifact name; GitHub rejects slashes, so it can't be the directory
name: Duvet Report

on:
  workflow_call:
    inputs:
      projects:
        description: "JSON array of {name, project, artifact} objects."
        required: true
        type: string

jobs:
  duvet:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.projects) }}
    runs-on: codebuild-CryptoToolsCI-linux-aws-crypto-tools-rust-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # Install a pinned duvet release with its published Cargo.lock (--locked),
      # so a new crates.io release never runs here unreviewed. Bump the version
      # in a PR after reading the changelog. duvet has no prebuilt binary, so it
      # builds from source.
      - name: Install duvet
        run: cargo +stable install duvet --version 0.4.3 --locked

      - name: Run duvet
        run: make duvet

      - name: Upload duvet report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          include-hidden-files: true
          path: ${{ matrix.project }}/.duvet/reports/report.html
