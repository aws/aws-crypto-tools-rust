# Reusable workflow that runs duvet for projects (subdirectories) and uploads
# each HTML compliance report as a build artifact. Callers pass a JSON array of
# {name, project, artifact} objects via the `projects` input; `project` is the
# directory (e.g. "esdk/shims/aws-esdk-cpp") and `artifact` the artifact name,
# which cannot contain slashes. Each project must have a `.duvet/config.toml`
# and a `make duvet` target.
name: Duvet Report

on:
  workflow_call:
    inputs:
      projects:
        description: "JSON array of {name, project, artifact} objects."
        required: true
        type: string

jobs:
  duvet:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.projects) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      # Install duvet at its latest published release, matching the duvet
      # workflow in aws-cryptographic-material-providers-library. duvet has no
      # prebuilt binary, so it builds from source; cargo/rustup are
      # preinstalled on the runner.
      - name: Install duvet
        run: cargo +stable install duvet

      - name: Run duvet
        run: make duvet

      - name: Upload duvet report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          include-hidden-files: true
          path: ${{ matrix.project }}/.duvet/reports/report.html
