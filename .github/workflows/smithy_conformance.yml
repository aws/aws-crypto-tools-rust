# Reusable workflow: check each published crate's public API against the Smithy
# models it implements, one job per crate. The crates come from
# `scripts/smithy-conformance/conform.py --list`, so a new crate is checked
# without editing this file. Each job uploads its report and review page.
name: Smithy Conformance

on:
  workflow_call:

jobs:
  list:
    name: List crates
    runs-on: codebuild-CryptoToolsCI-linux-aws-crypto-tools-rust-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: List crates
        id: list
        run: |
          crates=$(python3 scripts/smithy-conformance/conform.py --list)
          # GitHub rejects slashes in artifact names, so each crate gets a slash-free one.
          matrix=$(jq -c 'map({crate: ., artifact: ("smithy-conformance-" + gsub("/"; "-"))})' <<< "$crates")
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.crate }}
    needs: list
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.matrix) }}
    runs-on: codebuild-CryptoToolsCI-linux-aws-crypto-tools-rust-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Every crate is documented, not just this job's, so each model service
      # can be matched to the crate that implements it.
      - name: List cargo workspaces
        id: workspaces
        run: |
          {
            echo "dirs<<EOF"
            python3 scripts/smithy-conformance/conform.py --list | jq -r '.[]'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-rust
        with:
          workspaces: ${{ steps.workspaces.outputs.dirs }}

      # rustdoc JSON is a nightly-only output.
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      # The Smithy CLI and the model repos, both pinned in config.toml.
      - name: Cache the Smithy CLI and models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/smithy-conformance/smithy-cli-*
            ~/.cache/smithy-conformance/models
          key: smithy-conformance-${{ hashFiles('scripts/smithy-conformance/config.toml') }}

      - name: Check ${{ matrix.crate }}
        run: python3 scripts/smithy-conformance/conform.py --crate "${{ matrix.crate }}" --out "$RUNNER_TEMP/conformance"

      - name: Write the job summary
        if: always()
        run: |
          [[ -f "$RUNNER_TEMP/conformance/report.md" ]] || exit 0
          sed '/^## Open findings by check/,$d' "$RUNNER_TEMP/conformance/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report and review page
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/conformance/report.md
            ${{ runner.temp }}/conformance/findings.json
            ${{ runner.temp }}/conformance/review.html
