# All CI for this repo. Each top-level job is one area, shown as its own group
# in the Actions sidebar.
#
#   pull_request   runs only the jobs the change affects
#   push to main   runs everything
#   schedule       runs everything daily; a failure opens a "Daily CI failing"
#                  issue (or comments on the open one), the next pass closes it
#
# Pull requests follow the crates' path dependencies:
#
#   prim <- mpl <- esdk (including the esdk/shims/aws-esdk-cpp C++ shim)
#
# so an mpl change re-tests mpl, esdk, the C++ shim, and their TestServers.
# A change to shared infrastructure (workflows, the spec submodule, errors.toml,
# xtask) runs everything.
#
# The daily run exists because no Cargo.lock is committed, the toolchain is
# `stable`, and the TestServer pulls other repos' servers: CI can break without
# a push here.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "00 15 * * *" # 15:00 UTC (8AM PDT)
  workflow_dispatch:

# Pull requests cancel their previous run; other runs queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Emits what to run: JSON matrices for the fan-out jobs and booleans for the
  # rest.
  detect:
    name: Detect what to run
    # Don't run the cron builds on forks
    if: github.event_name != 'schedule' || github.repository_owner == 'aws'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists the PR's files through the GitHub API.
      pull-requests: read
    outputs:
      rust-projects: ${{ steps.set.outputs.rust-projects }}
      duvet-projects: ${{ steps.set.outputs.duvet-projects }}
      test-server-builds: ${{ steps.set.outputs.test-server-builds }}
      esdk-test-server-focus: ${{ steps.set.outputs.esdk-test-server-focus }}
      mpl-test-server: ${{ steps.set.outputs.mpl-test-server }}
      prim-test-server: ${{ steps.set.outputs.prim-test-server }}
      cpp-shim: ${{ steps.set.outputs.cpp-shim }}
    steps:
      - uses: actions/checkout@v6

      - name: Filter changed paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            prim: &prim
              - 'prim/**'
            mpl: &mpl
              - *prim
              - 'mpl/**'
            esdk: &esdk
              - *mpl
              - 'esdk/**'
            prim-test-server:
              - *prim
              - 'prim-test-server/**'
            mpl-test-server:
              - *mpl
              - 'mpl-test-server/**'
            esdk-test-server:
              - *esdk
              - 'esdk-test-server/**'
            esdk-cpp-test-server:
              - *esdk
              - 'esdk-test-server/**'
              - 'esdk-cpp-test-server/**'
            shared:
              - '.github/**'
              - 'spec'
              - '.gitmodules'
              - 'errors.toml'
              - 'xtask/**'

      - name: Compute what to run
        id: set
        shell: bash
        env:
          ALL: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' }}
          prim: ${{ steps.filter.outputs.prim }}
          mpl: ${{ steps.filter.outputs.mpl }}
          esdk: ${{ steps.filter.outputs.esdk }}
          prim_test_server: ${{ steps.filter.outputs.prim-test-server }}
          mpl_test_server: ${{ steps.filter.outputs.mpl-test-server }}
          esdk_test_server: ${{ steps.filter.outputs.esdk-test-server }}
          esdk_cpp_test_server: ${{ steps.filter.outputs.esdk-cpp-test-server }}
        run: |
          set -eo pipefail

          # `run <filter>` succeeds when that filter's job should run.
          run() { [[ "$ALL" == "true" || "${!1:-false}" == "true" ]]; }

          rust=()
          for p in esdk mpl prim; do
            if run "$p"; then rust+=("\"$p\""); fi
          done

          duvet=()
          if run esdk; then
            duvet+=('{"name":"esdk","project":"esdk","artifact":"esdk-duvet-report"}')
            duvet+=('{"name":"aws-esdk-cpp","project":"esdk/shims/aws-esdk-cpp","artifact":"aws-esdk-cpp-duvet-report"}')
          fi

          builds=()
          focus=()
          if run esdk_test_server; then
            builds+=('{"name":"esdk-test-server","server":"esdk-test-server","prebuild":"","os":"ubuntu-latest"}')
            focus+=('"rust"')
          fi
          if run esdk_cpp_test_server; then
            for os in ubuntu macos; do
              builds+=("{\"name\":\"esdk-cpp-test-server ($os)\",\"server\":\"esdk-cpp-test-server\",\"prebuild\":\"esdk/shims/aws-esdk-cpp\",\"os\":\"$os-latest\"}")
            done
            focus+=('"rust-cpp"')
          fi
          if run mpl_test_server; then
            builds+=('{"name":"mpl-test-server","server":"mpl-test-server","prebuild":"","os":"ubuntu-latest"}')
          fi
          if run prim_test_server; then
            builds+=('{"name":"prim-test-server","server":"prim-test-server","prebuild":"","os":"ubuntu-latest"}')
          fi

          json() { local IFS=,; echo "[$*]"; }
          bool() { if run "$1"; then echo true; else echo false; fi; }
          {
            echo "rust-projects=$(json "${rust[@]}")"
            echo "duvet-projects=$(json "${duvet[@]}")"
            echo "test-server-builds=$(json "${builds[@]}")"
            echo "esdk-test-server-focus=$(json "${focus[@]}")"
            echo "mpl-test-server=$(bool mpl_test_server)"
            echo "prim-test-server=$(bool prim_test_server)"
            echo "cpp-shim=$(bool esdk)"
          } | tee -a "$GITHUB_OUTPUT"

  rust-tests:
    name: Rust tests
    needs: detect
    if: needs.detect.outputs.rust-projects != '[]'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/library_rust_tests.yml
    with:
      projects: ${{ needs.detect.outputs.rust-projects }}

  cpp-shim:
    name: C++ shim
    needs: detect
    if: needs.detect.outputs.cpp-shim == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/library_cpp_shim_tests.yml

  duvet:
    name: Duvet
    needs: detect
    if: needs.detect.outputs.duvet-projects != '[]'
    permissions:
      contents: read
    uses: ./.github/workflows/duvet.yml
    with:
      projects: ${{ needs.detect.outputs.duvet-projects }}

  test-server-builds:
    name: TestServer builds
    needs: detect
    if: needs.detect.outputs.test-server-builds != '[]'
    permissions:
      contents: read
    uses: ./.github/workflows/test_server_build.yml
    with:
      builds: ${{ needs.detect.outputs.test-server-builds }}

  # The cross-language TestServer runs, from the shared commons workflows. This
  # checkout supplies the focus language's server; every other server comes
  # from its configured branch. Only the pairs involving the focus language
  # run; the full matrix runs in commons.
  esdk-test-server:
    name: ESDK TestServer (${{ matrix.focus }})
    needs: detect
    if: needs.detect.outputs.esdk-test-server-focus != '[]'
    strategy:
      fail-fast: false
      matrix:
        focus: ${{ fromJSON(needs.detect.outputs.esdk-test-server-focus) }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: aws/aws-crypto-tools-commons/.github/workflows/esdk-test-server-reusable.yml@main
    with:
      focus: ${{ matrix.focus }}
      checkout-languages: ${{ matrix.focus }}
    secrets:
      repo-pat: ${{ secrets.COMMONS_REPO_PAT }}

  mpl-test-server:
    name: MPL TestServer
    needs: detect
    if: needs.detect.outputs.mpl-test-server == 'true'
    permissions:
      contents: read
      actions: read
    uses: aws/aws-crypto-tools-commons/.github/workflows/mpl-test-server-reusable.yml@main
    with:
      focus: rust
      checkout-languages: rust
    secrets:
      repo-pat: ${{ secrets.COMMONS_REPO_PAT }}

  prim-test-server:
    name: Primitives TestServer
    needs: detect
    if: needs.detect.outputs.prim-test-server == 'true'
    permissions:
      contents: read
      actions: read
    uses: aws/aws-crypto-tools-commons/.github/workflows/primitives-test-server-reusable.yml@main
    with:
      focus: rust
      checkout-languages: rust
    secrets:
      repo-pat: ${{ secrets.COMMONS_REPO_PAT }}

  # Check that the generated error types files match the errors.toml definitions.
  gen-errors:
    name: Error codegen is current
    if: github.event_name != 'schedule' || github.repository_owner == 'aws'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --manifest-path xtask/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

      - name: Test the generator
        run: cargo test --manifest-path xtask/Cargo.toml

      - name: Check the generated files
        run: cargo xtask gen-errors --check

  # The single required status check for the main branch ruleset. It passes
  # when every job succeeded or was skipped as unaffected by the change.
  pr-ci-all-required:
    if: always() && github.event_name == 'pull_request'
    needs:
      - detect
      - rust-tests
      - cpp-shim
      - duvet
      - test-server-builds
      - esdk-test-server
      - mpl-test-server
      - prim-test-server
      - gen-errors
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            rust-tests, cpp-shim, duvet, test-server-builds, esdk-test-server,
            mpl-test-server, prim-test-server

  daily-report:
    name: Daily report
    if: always() && github.event_name == 'schedule' && github.repository_owner == 'aws'
    needs:
      - detect
      - rust-tests
      - cpp-shim
      - duvet
      - test-server-builds
      - esdk-test-server
      - mpl-test-server
      - prim-test-server
      - gen-errors
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Daily CI failing"
          issue=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")

          if [[ "$FAILED" == "false" ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "Daily CI passed: $RUN_URL"
            fi
          elif [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "Daily CI failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "Daily CI failed: $RUN_URL"
          fi
