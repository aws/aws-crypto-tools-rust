# Run all tests for C++ shim (Rust/C++ unit/integ tests)
name: aws-esdk-cpp shim

on:
  pull_request:
    paths:
      - "esdk/**"
      - "!esdk/test-server/**"
      - "!esdk/shims/aws-esdk-cpp/test-server/**"
      - ".github/workflows/aws-esdk-cpp.yml"
  push:
    paths:
      - "esdk/**"
      - "!esdk/test-server/**"
      - "!esdk/shims/aws-esdk-cpp/test-server/**"
      - ".github/workflows/aws-esdk-cpp.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  shim:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ESDK_TEST_KMS_KEY_ARN: arn:aws:kms:us-west-2:370957321024:key/9d989aa2-2f9c-438c-a745-cc57d3ad0126
      ESDK_TEST_DDB_TABLE: KeyStoreDdbTable
      ESDK_TEST_LOGICAL_KEYSTORE: KeyStoreDdbTable
      ESDK_TEST_BRANCH_KEY_ID: 3ce7656b-e166-40f3-8c9b-a920ce6596cd
      ESDK_TEST_REGION: us-west-2
    defaults:
      run:
        working-directory: esdk/shims/aws-esdk-cpp
    steps:
      - uses: actions/checkout@v4

      # GHA runners crash if they hold the statically linked aws-lc and AWS SDKs.
      # Reclaim the large preinstalled toolchains this job does not use.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      # integration tests need real KMS + DynamoDB
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2

      # aws-lc-sys needs Go to build
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: esdk/shims/aws-esdk-cpp

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test (Rust unit + integration tests)
        run: make test-ci-rust

      - name: Build and run C++ facade, example, and integration and local-correctness tests
        if: runner.os == 'Linux'
        run: make test-ci-cpp
