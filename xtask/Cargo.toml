[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Repository tasks. `gen-errors` writes each library's error types from errors.toml; `check-public-paths` checks each public item has one path."
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.6"

# Its own workspace, like every other crate in this repository.
[workspace]
