[package]
name = "aws-s3-encryption"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "AWS S3 Encryption Client (S3EC) for Rust — client-side encryption for Amazon S3 (V4 message format)."

[dependencies]
aws-config = "1.8.18"
aws-lc-rs = "1.17.0"
aws-sdk-kms = "1.111.0"
aws-sdk-s3 = "1.137.0"
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
